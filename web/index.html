<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Hubbo</title>
    <!-- API: see /llms.txt and /api/v1/agent.md -->
    <link rel="alternate" type="text/markdown" href="/llms.txt" title="API guide for agents" />
    <script>
      // Apply the theme before first paint (no flash). Theme is a display
      // preference, not a secret, so localStorage is fine here.
      try {
        var t = localStorage.getItem('hubbo.theme') || 'system'
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
