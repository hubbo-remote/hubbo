openapi: 3.1.0
info:
  title: Hubbo API
  version: 0.1.0
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  summary: A Hubbo hub's local REST API. Hubbo is a universal-remote hub that runs activities across TVs, receivers, streamers and Home Assistant.
  description: |
    Source of truth for `/api/v1`. The web UI, LLM agents, the TypeScript mock
    server and the native simulator all implement or consume this contract.
    New here? Read the agent guide, `GET /api/v1/agent.md`.

    ## Conventions

    * **Roles.** Every operation carries `x-hubbo-role`:
      * `public`: no credentials.
      * `token`: an API token **or** the admin session.
      * `admin`: the admin session only. API tokens get `403 forbidden`.
      The table is mirrored in `core/src/auth/policy.cpp`; `api/lint.sh` fails if
      the two disagree.
    * **Test markers.** `x-hubbo-returns-secret`: the response carries a secret
      (once). `x-hubbo-describes-api`: the response is this spec, whose schemas
      name secret and revision fields. The contract skips its body scans for
      these.
    * **Config state.** Every edit (activities, global bindings, smart buttons, devices) is
      refused with `409 config_blocked` while `/status` `config.state` is
      `blocked`, and with `503 storage_unavailable` while it is
      `storage_unavailable`. Restore and reset are the way out.
    * **Credentials.** Browser: the `hubbo_session` cookie from `POST /auth/login`
      (HttpOnly, SameSite=Strict; 7 days, or until the hub reboots).
      Agents: `Authorization: Bearer hbt_...`.
    * **Cross-site requests.** A POST/PUT/DELETE whose `Origin` header names
      another host gets `403 csrf_failed`. With SameSite=Strict and JSON-only
      bodies, that's the whole defence; there's no CSRF token.
    * **Bodies.** Requests with a body must be `Content-Type: application/json`
      (the firmware upload: `application/octet-stream`), otherwise
      `415 unsupported_media_type`. Unknown fields are rejected. Default body
      limit is 16 KiB; activity bodies 32 KiB; restore 640 KiB, the largest
      saved config (512 KiB) plus headroom for the backup wrapper and
      pretty-printing; the firmware image the OTA slot, 6.25 MiB
      (`x-hubbo-max-body`). JSON nesting deeper than 10 levels is rejected.
    * **Errors.** Every non-2xx response has the `Error` body. Any request can
      also get `405 method_not_allowed`. A body larger than the operation
      accepts (any body, for operations that take none) is refused with
      `413 payload_too_large` before it is read.
    * **Optimistic concurrency.** Editable documents (activities, devices,
      integration settings) carry an integer `revision`. Replace/delete must send
      the revision they were based on; a stale one gets `409 revision_conflict`
      with `current_revision`. No `ETag`/`If-Match`.
    * **IDs.** Server-assigned, prefixed (`dev_`, `act_`, `tok_`). Integration
      IDs are fixed per instance (`system`, `ble`, `ha_main`). IDs are stable;
      names are for humans and never used to execute anything.
    * **Triggers** are `"<button>:<event>"`, e.g. `"volume_up:down"`,
      `"info:hold"`. Buttons come from `GET /remote/buttons`; events are
      `down`, `up`, `tap`, `hold`.
    * **Secrets** (passwords, HA access token) are `writeOnly`: accepted, never
      returned. API token plaintext is returned once, at creation.
    * **Command execution** returns `200` with `status: accepted|failed|timeout`
      once the command was handed to an adapter. `accepted` means the
      integration took it, not that the device physically responded. A `4xx`
      means nothing was sent.
  x-hubbo-limits:
    # Mirrors core/include/hubbo/domain/limits.h where both define a bound.
    max_devices: 64
    max_activities: 16
    max_profile_commands: 128
    max_ble_devices: 4
    max_sequence_actions: 32
    max_binding_actions: 32
    max_params_per_action: 4
    max_param_string_length: 64
    max_api_tokens: 16
    max_sessions: 8
    max_wait_ms: 60000
    name_max_length: 64
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - bearerToken: []
tags:
  - name: discovery
  - name: status
  - name: auth
  - name: remote
  - name: devices
  - name: profiles
  - name: activities
  - name: integrations
  - name: admin
paths:
  /:
    get:
      tags: [discovery]
      operationId: getApiIndex
      x-hubbo-role: public
      security: []
      summary: Where to start
      description: |
        Links to the agent guide and this spec, and how to authenticate.
        Public: it says nothing about the home (not even the hub's name).
      responses:
        '200':
          description: The index
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiIndex'}

  /openapi.json:
    get:
      tags: [discovery]
      operationId: getOpenApi
      x-hubbo-role: public
      x-hubbo-describes-api: true
      security: []
      summary: This spec, as JSON
      description: |
        This document, as built into the firmware. Gzipped when the request's
        `Accept-Encoding` allows it (`Vary: Accept-Encoding`).
      responses:
        '200':
          description: The OpenAPI document
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenApiDocument'}

  /agent.md:
    get:
      tags: [discovery]
      operationId: getAgentGuide
      x-hubbo-role: public
      security: []
      summary: The agent guide
      description: |
        How to manage the hub with an API token: devices, activities, buttons
        and errors, with worked examples. Markdown. Gzipped when the request's
        `Accept-Encoding` allows it (`Vary: Accept-Encoding`).
      responses:
        '200':
          description: The guide
          content:
            text/markdown:
              schema: {type: string}

  /status:
    get:
      tags: [status]
      operationId: getStatus
      x-hubbo-role: token
      summary: Hub status and diagnostics
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '200':
          description: Status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
        '401': {$ref: '#/components/responses/Unauthenticated'}

  /remote/status:
    get:
      tags: [remote]
      operationId: getRemoteStatus
      x-hubbo-role: token
      summary: Remote pairing and radio status
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '200':
          description: Remote status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemoteStatus'}
        '401': {$ref: '#/components/responses/Unauthenticated'}

  /remote/buttons:
    get:
      tags: [remote]
      operationId: listRemoteButtons
      x-hubbo-role: token
      summary: Buttons and trigger event kinds of the remote
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '200':
          description: Buttons
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemoteButtons'}
        '401': {$ref: '#/components/responses/Unauthenticated'}

  /auth/setup:
    post:
      tags: [auth]
      operationId: setupAdmin
      x-hubbo-role: public
      x-hubbo-max-body: 1024
      summary: Create the admin account (first run only)
      description: |
        The caller picks the username and password (there's no default
        username). Only succeeds while `auth_state` is `fresh`; afterwards
        `409 setup_already_done`, and `503 storage_unavailable` while it's
        `unavailable`. On success the caller is logged in (same response as
        login).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetupRequest'}
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '400': {$ref: '#/components/responses/MalformedJson'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
        '201':
          description: Admin created and logged in
          headers:
            Set-Cookie: {$ref: '#/components/headers/SessionCookie'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      x-hubbo-role: public
      x-hubbo-max-body: 1024
      summary: Log in as admin
      description: |
        Sets an HttpOnly, SameSite=Strict `hubbo_session` cookie (`Secure` when
        served over HTTPS) that lasts 7 days, or until the hub reboots. There's
        no rate limit: the password hash's cost slows guessing. The `Origin`
        header, when present, must match the hub's host.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '400': {$ref: '#/components/responses/MalformedJson'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
        '200':
          description: Logged in
          headers:
            Set-Cookie: {$ref: '#/components/headers/SessionCookie'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401':
          description: Wrong username or password (`invalid_credentials`)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: No admin account yet (`setup_required`)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      x-hubbo-role: public
      summary: End the current session
      description: Idempotent. Clears the cookie; deletes the session if it exists.
      security: []
      responses:
        '403': {$ref: '#/components/responses/Forbidden'}
        '204':
          description: Logged out
          headers:
            Set-Cookie: {$ref: '#/components/headers/SessionCookie'}

  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      x-hubbo-role: public
      summary: Who am I
      description: |
        Always `200`. Tells the UI whether to show the first-run wizard
        (`setup_required`), the login page, or the app, and whether the hub runs
        the simulator auth bypass.
      security: []
      responses:
        '200':
          description: Session state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}

  /devices:
    get:
      tags: [devices]
      operationId: listDevices
      x-hubbo-role: token
      summary: Registered devices
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '200':
          description: Devices
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}

  /devices/{device_id}:
    parameters:
      - $ref: '#/components/parameters/DeviceIdPath'
    get:
      tags: [devices]
      operationId: getDevice
      x-hubbo-role: token
      summary: One registered device, with its profile's commands
      description: |
        A Bluetooth device also carries its profile's `commands`, `buttons`,
        `power`, `timing`, `inputs` and `channels`, as `GET /devices` doesn't.
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '200':
          description: Device
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceDetail'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}

  /devices/{device_id}/capabilities:
    parameters:
      - $ref: '#/components/parameters/DeviceIdPath'
    get:
      tags: [devices]
      operationId: getDeviceCapabilities
      x-hubbo-role: token
      summary: Commands this device accepts, with parameter schemas
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '200':
          description: Capabilities
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceCapabilities'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}

  /devices/{device_id}/commands/{command_id}/execute:
    parameters:
      - $ref: '#/components/parameters/DeviceIdPath'
      - name: command_id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/CommandId'}
    post:
      tags: [devices]
      operationId: executeCommand
      x-hubbo-role: token
      x-hubbo-max-body: 2048
      summary: Run one registered command now
      description: |
        Uses the same executor as activities. The target is the registered
        device; the body holds only typed params checked against the command's
        parameter schema. `200` means the command reached the adapter; read
        `status`. `4xx` means nothing was sent.

        Only `momentary` commands (see `effect` in capabilities). A `hold`
        command such as `key_down` would leave a key held with nothing to
        release it, so it gets `422` with detail code `hold_not_allowed`;
        use the momentary form (`key_tap`). Bindings may use holds.
        A `wait` command (`wait_connected`) only makes sense in a startup or
        shutdown sequence, so it gets `422` with detail code `sequence_only`.
        A timed `press` (the profile command's `hold_ms`, or the `hold_ms`
        param) answers once the key is down; the hub releases it after that
        long.

        A stale device (`availability: stale`: its HA entity is missing from
        the latest discovery) answers `200` with `status: failed` and
        `message: entity_not_found`; nothing is sent to HA.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExecuteRequest'}
      responses:
        '400': {$ref: '#/components/responses/MalformedJson'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '200':
          description: Handed to the adapter
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecuteResult'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /profiles:
    get:
      tags: [profiles]
      operationId: listProfiles
      x-hubbo-role: admin
      summary: The built-in device profiles
      description: |
        The light list for picking a device to add: `POST /admin/devices`
        with a `profile_id`. Search it by `manufacturer` and `model`.
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '200':
          description: Profiles
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfileList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /profiles/{profile_id}:
    parameters:
      - $ref: '#/components/parameters/ProfileIdPath'
    get:
      tags: [profiles]
      operationId: getProfile
      x-hubbo-role: admin
      summary: One built-in profile
      description: |
        The profile document as the hub keeps it: the device profile spec's
        format without `meta`.
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '200':
          description: Profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /kinds:
    get:
      tags: [profiles]
      operationId: listKinds
      x-hubbo-role: admin
      summary: Device kinds, in display order
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '200':
          description: Kinds
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KindList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /activities:
    get:
      tags: [activities]
      operationId: listActivities
      x-hubbo-role: token
      summary: All activities and the active one
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '200':
          description: Activities
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivityList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
    post:
      tags: [activities]
      operationId: createActivity
      x-hubbo-role: token
      x-hubbo-max-body: 32768
      summary: Create an activity in one request
      description: Validated exactly like `POST /activities/validate`; nothing is stored unless valid.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActivityInput'}
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '400': {$ref: '#/components/responses/MalformedJson'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '201':
          description: Created
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Activity'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /activities/validate:
    post:
      tags: [activities]
      operationId: validateActivity
      x-hubbo-role: token
      x-hubbo-max-body: 32768
      summary: Dry-run validation of an activity
      description: |
        Runs every check a create/replace would (schema, registered devices,
        integration ownership, command IDs, param bounds, triggers) without
        storing anything. Returns `200` whether or not it is valid. `id` and
        `revision` may be present (for checking an edited copy) and are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActivityReplace'}
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '200':
          description: Validation outcome
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationResult'}
        '400': {$ref: '#/components/responses/MalformedJson'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}

  /activities/off:
    post:
      tags: [activities]
      operationId: activitiesOff
      x-hubbo-role: token
      summary: Run the active activity's shutdown and clear it
      description: |
        Same as the remote's Off button. Runs only the current activity's
        shutdown sequence. With no active activity it does nothing
        (`switched: false`, shutdown `none`).

        `200` means it happened; read `shutdown` for whether the sequence was
        queued. Never retry a `switched: true` result. `503 busy` means the
        request never reached the engine, so nothing changed and a retry is
        safe.
        While the config is `blocked` (nothing runs) this answers `409
        config_blocked`. With the store unavailable, switching still works;
        the active activity just isn't saved.
      responses:
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '200':
          description: Done (see `switched` and `shutdown`)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransitionResult'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /activities/{activity_id}:
    parameters:
      - $ref: '#/components/parameters/ActivityIdPath'
    get:
      tags: [activities]
      operationId: getActivity
      x-hubbo-role: token
      summary: One activity
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '200':
          description: Activity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Activity'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [activities]
      operationId: replaceActivity
      x-hubbo-role: token
      x-hubbo-max-body: 32768
      summary: Atomically replace an activity
      description: |
        Whole-document replace. Send the `revision` you read; `id` and
        `schema_version` may be echoed back unchanged, so GET → edit → PUT works.
        If this is the active activity the new mapping takes effect atomically;
        the startup sequence does not re-run.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActivityReplace'}
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '400': {$ref: '#/components/responses/MalformedJson'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '200':
          description: Replaced
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Activity'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      tags: [activities]
      operationId: deleteActivity
      x-hubbo-role: token
      summary: Delete an activity
      description: Deleting the active activity switches the hub to the next activity (the one that takes its list position, wrapping to the first) and runs its startup. No shutdown runs. The hub is inactive only when no activities remain.
      parameters:
        - $ref: '#/components/parameters/RevisionQuery'
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /activities/{activity_id}/activate:
    parameters:
      - $ref: '#/components/parameters/ActivityIdPath'
    post:
      tags: [activities]
      operationId: activateActivity
      x-hubbo-role: token
      summary: Switch to this activity
      description: |
        Selects the activity's mapping atomically and queues its startup
        sequence. Never runs the previous activity's shutdown. Activating the
        already active activity re-runs its startup.

        `200` means the hub switched (`switched: true`), even if the startup
        sequence could not be queued (`startup.status: rejected` with a
        reason): don't retry it, that would run a second full transition.
        `503 busy` means the request never reached the engine, so nothing
        changed and a retry is safe.
        While the config is `blocked` (nothing runs) this answers `409
        config_blocked`. With the store unavailable, switching still works;
        the active activity just isn't saved.
      responses:
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '200':
          description: Switched (see `startup`)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransitionResult'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /global-bindings:
    get:
      tags: [activities]
      operationId: getGlobalBindings
      x-hubbo-role: token
      summary: Bindings for buttons the active activity doesn't bind
      description: |
        Applied per button, not per trigger: if the active activity binds any
        trigger of a button (down, up, tap or hold), none of that button's
        global bindings apply. With no activity, all of them apply. This is
        where activity buttons live, e.g.
        `"tv:tap": [system/activate {activity_id}]` and `"off:tap": [system/off]`.
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '200':
          description: Global bindings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GlobalBindings'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
    put:
      tags: [activities]
      operationId: replaceGlobalBindings
      x-hubbo-role: token
      x-hubbo-max-body: 32768
      summary: Atomically replace the global bindings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GlobalBindings'}
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '400': {$ref: '#/components/responses/MalformedJson'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '200':
          description: Replaced
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GlobalBindings'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /smart-buttons:
    get:
      tags: [activities]
      operationId: getSmartButtons
      x-hubbo-role: token
      summary: The Light 1, Light 2, Switch 1 and Switch 2 slots
      description: |
        Each of the four buttons is a slot that holds a device, or null. The
        hub works out what the slot's own button and `plus`/`minus` do from
        the device's `kind` and the commands it offers; `actions` shows the
        result, read-only:

        | Kind | button tap | button hold | plus | minus |
        |---|---|---|---|---|
        | light | Turn on | Turn off | tap: Change brightness (`step` +26, 10%) | tap: `step` −26 |
        | fan | Turn on | Turn off | tap: Speed up | tap: Slow down |
        | cover | Open | Close | tap: Change position (`step` +10); hold: Open; release: Stop | tap: `step` −10; hold: Close; release: Stop |
        | switch | Turn on | Turn off | none | none |

        Each action is there only if the device offers that command, so the
        kind works whatever the entity's domain (an `input_boolean` set to
        `switch` gets its own Turn on and Turn off). A light without
        brightness gets no plus/minus; a cover without a position gets tap
        Open on plus and tap Close on minus. Any other kind, a device that
        isn't Home Assistant, or a null slot, gets empty presses.

        A press of a slot's button selects it (see `/status`
        `selected_slot`; `light_1` after a reboot), unless the active
        activity binds that button. For light_1, light_2, switch_1,
        switch_2, plus and minus, the first that has actions wins: the
        active activity's bindings for that button, then the slot (the
        slot's own button, or the selected slot's `plus`/`minus`), then the
        global bindings. Quick taps on plus or minus with a `step` merge
        into one call.
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '200':
          description: The four slots and their actions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SmartButtons'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
    put:
      tags: [activities]
      operationId: replaceSmartButtons
      x-hubbo-role: token
      x-hubbo-max-body: 4096
      summary: Atomically replace the four slots
      description: |
        `{slots, revision}`: `revision` is the one the body is based on, and
        a stale one is `409 revision_conflict`. Each slot is a registered
        device's id or null; an unknown one is `unknown_device` at
        `/slots/<slot>`. `actions` isn't sent: the hub derives it. Answers
        as `GET` does.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SmartButtonsInput'}
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '400': {$ref: '#/components/responses/MalformedJson'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '200':
          description: Replaced
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SmartButtons'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /smart-buttons/actions:
    get:
      tags: [activities]
      operationId: getSmartButtonActions
      x-hubbo-role: token
      summary: What a slot would do with a device
      description: |
        The actions a slot gets from `device_id`, by the table in
        `GET /smart-buttons`, without saving anything: a preview before
        `PUT /smart-buttons`. A device that isn't Home Assistant, or of
        another kind, gets empty presses.
      parameters:
        - name: device_id
          in: query
          required: true
          schema: {$ref: '#/components/schemas/DeviceId'}
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '200':
          description: The slot's actions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SmartSlotActions'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /integrations:
    get:
      tags: [integrations]
      operationId: listIntegrations
      x-hubbo-role: token
      summary: Integration instances (safe summaries, no settings or secrets)
      description: |
        `system`, `ble` (Bluetooth) and `ha_main` (Home Assistant)
        are built in and always present, even on a fresh hub; they can be
        configured and disabled but not created or deleted. `ha_main` is
        `not_configured` until it has a URL and an access token
        (`PUT /admin/integrations/ha_main`).
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '200':
          description: Integrations
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IntegrationList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}

  /admin/integrations/{integration_id}:
    parameters:
      - $ref: '#/components/parameters/IntegrationIdPath'
    get:
      tags: [admin]
      operationId: getIntegrationConfig
      x-hubbo-role: admin
      summary: Integration settings (secrets reported only as `has_*` flags)
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '501': {$ref: '#/components/responses/NotImplemented'}
        '200':
          description: Settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IntegrationConfig'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [admin]
      operationId: configureIntegration
      x-hubbo-role: admin
      x-hubbo-max-body: 8192
      summary: Change integration settings
      description: |
        Omit a secret field to keep the stored value; send `null` to clear it.
        Changing the Home Assistant URL clears the stored token unless a new
        one is sent in the same request (stops a token being sent to a
        different host). Likewise, changing the MQTT broker's `host` clears
        its stored password.

        The Home Assistant token is write-only: it goes to the hub's secret
        store and is never returned, logged or put in a backup. Responses
        show only `has_access_token`. The client reconnects with the new
        settings; `GET /integrations` shows its `state`. The hub connects to
        `<url>/api/websocket`: `ws://` for an `http://` URL, `wss://` for
        `https://`. An empty `url` unsets it (and clears the token).

        MQTT (`mqtt_main`): the hub shows up in Home Assistant through MQTT
        discovery as one device with an Activity select, a Power switch and a
        Restart button. The password is write-only like the HA token
        (`has_password`). Anyone who can publish to the broker can switch
        activities and restart the hub.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IntegrationConfigUpdate'}
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '400': {$ref: '#/components/responses/MalformedJson'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '501': {$ref: '#/components/responses/NotImplemented'}
        '200':
          description: Saved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IntegrationConfig'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /admin/integrations/{integration_id}/entities/{entity_id}/details:
    parameters:
      - $ref: '#/components/parameters/IntegrationIdPath'
      - name: entity_id
        in: path
        required: true
        schema: {type: string, pattern: '^[a-z0-9_]+\.[a-z0-9_]+$', maxLength: 96}
    post:
      tags: [admin]
      operationId: requestEntityDetails
      x-hubbo-role: admin
      summary: Load an entity's details (HA)
      description: |
        Starts loading the entity's attributes and its integration's
        services from Home Assistant (about 2 s on the hub), which
        registering it needs. One at a time: a new request replaces the
        earlier one. Poll the GET until `done` or `failed`. `home_assistant`
        integrations only (404 for others); `422` if `entity_id` isn't one
        `media_player`, `light`, `switch` or `fan` entity; `503
        integration_unavailable` if HA isn't connected.
      responses:
        '202':
          description: Loading
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntityDetailsStatus'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/Unavailable'}
    get:
      tags: [admin]
      operationId: getEntityDetails
      x-hubbo-role: admin
      summary: An entity's loaded details (HA)
      description: |
        Kept until the next request, an HA settings change, a restore or
        reset, or a reboot; `idle` for any other entity.
      responses:
        '200':
          description: The details' state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntityDetailsStatus'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /admin/integrations/{integration_id}/discover:
    parameters:
      - $ref: '#/components/parameters/IntegrationIdPath'
    post:
      tags: [admin]
      operationId: discoverIntegration
      x-hubbo-role: admin
      summary: Start discovering candidate devices
      description: |
        Home Assistant only (another integration gets `404`). Starts reading
        `get_states`, `get_services` and the entity registry on the
        integration's task (it can take several seconds on the hub) and
        answers `202` at once. If a discovery is already running, answers
        `202` with that one. Poll `GET` for the result. `503
        integration_unavailable` while HA isn't connected.
      responses:
        '202':
          description: Running
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiscoverStatus'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
    get:
      tags: [admin]
      operationId: getDiscovery
      x-hubbo-role: admin
      summary: Discovery progress and candidates
      description: |
        `idle` (none since boot), `running`, `done` (with `candidates`) or
        `failed` (with `error`). Candidates are the entities of the supported
        domains with the commands Hubbo would offer; nothing is executable
        until registered with `POST /admin/devices`. They stay in memory until
        the next discovery or a reboot.
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive substring of entity_id or name.
          schema: {type: string, maxLength: 48}
        - name: domain
          in: query
          required: false
          schema: {type: string, enum: [media_player, light, switch, fan, scene, script, cover, button, input_boolean, humidifier, select, remote]}
        - name: available
          in: query
          required: false
          description: |
            `true`: only candidates that can be registered (`supported`, with
            no `registered_device_id`). Applied before paging, like `q` and
            `domain`, so every page is full until the last.
          schema: {type: boolean, default: false}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: cursor
          in: query
          required: false
          schema: {type: string, maxLength: 64}
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiscoverStatus'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      tags: [admin]
      operationId: cancelDiscovery
      x-hubbo-role: admin
      summary: Cancel a running discovery and drop its candidates
      responses:
        '204': {description: Cancelled (or nothing was running)}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /admin/devices:
    post:
      tags: [admin]
      operationId: registerDevice
      x-hubbo-role: admin
      x-hubbo-max-body: 4096
      summary: Register a device
      description: |
        Home Assistant (`provider: {type: home_assistant, entity_id}`): load
        the entity's details first (`POST
        /admin/integrations/ha_main/entities/{entity_id}/details`, then poll
        its GET until `done`). The hub takes the entity's capabilities
        (attributes and integration services) from those details and stores
        them with the device, so its commands work (and configs compile)
        while HA is offline; `unique_id` is filled in from them. They're
        never accepted from the client (`ha_capabilities` is `unknown_field`)
        and never returned. `409 details_required` if this entity's details
        aren't loaded (none, another entity's, still running, failed, or from
        earlier HA settings); `422` (detail at `/provider/entity_id`)
        `unknown_device` if Hubbo offers no commands for it, `duplicate_id`
        if a device already uses the entity (also one HA renamed: the
        details match it by `unique_id`; re-link that device instead); `503
        integration_unavailable` on a hub without an HA client. An
        entity that HA later renames or removes shows as `availability:
        stale` once a discovery runs without it; its commands and actions
        then fail as `status: failed`, `message: entity_not_found` (not
        `integration_unavailable`, and nothing is sent to HA) until an admin
        re-links it (`PUT /admin/devices/{id}` with a `provider`, which
        refreshes the capabilities the same way).

        From a built-in profile (`{profile_id, name?, kind?}`, see `GET
        /profiles`): the hub copies its own copy of the profile into the
        device (without `meta`). The integration follows the profile's
        platform (`ble_hid`: `ble`). `name` defaults to the profile's
        `model`, `kind` to the profile's. `422` `unknown_profile` at
        `/profile_id` for an id the hub doesn't have. A Bluetooth device
        starts `not_paired` (pair it with `POST /admin/devices/{id}/pair`).
        At most 4 Bluetooth devices: a fifth is `422` with
        `too_many_devices` at `/integration_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceRegister'}
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '400': {$ref: '#/components/responses/MalformedJson'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '201':
          description: Registered
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceDetail'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /admin/devices/{device_id}:
    parameters:
      - $ref: '#/components/parameters/DeviceIdPath'
    put:
      tags: [admin]
      operationId: updateDevice
      x-hubbo-role: admin
      x-hubbo-max-body: 4096
      summary: Rename a device, change its kind, or re-link its provider reference
      description: |
        A Bluetooth device's profile fields are fixed once added
        (`unknown_field`); to change them, add the device again.

        Re-linking a Home Assistant device (`provider` with the entity's new
        `entity_id`, or the same one to refresh) takes its capabilities from
        that entity's loaded details, as registration does (`409
        details_required` without them), and clears `availability: stale`. Until then a stale device's commands
        fail as `status: failed`, `message: entity_not_found`.
        `ha_capabilities` is never accepted (`unknown_field`).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceUpdate'}
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '400': {$ref: '#/components/responses/MalformedJson'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceDetail'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      tags: [admin]
      operationId: deleteDevice
      x-hubbo-role: admin
      summary: Remove a device
      description: |
        Refused with `409 device_in_use` while any activity references it;
        `details` lists the references. A Bluetooth device's bond is forgotten
        with it.
      parameters:
        - $ref: '#/components/parameters/RevisionQuery'
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
        '204': {description: Removed}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /admin/devices/{device_id}/pair:
    parameters:
      - $ref: '#/components/parameters/DeviceIdPath'
    post:
      tags: [admin]
      operationId: startDevicePairing
      x-hubbo-role: admin
      summary: Open a pairing window for a Bluetooth device
      description: |
        Advertises for `window_s` seconds. The first new host that bonds
        becomes this device's host and replaces only this device's own bond;
        a host already paired with another device stays with that device.
        Poll `GET .../pair` until it isn't `pairing`: a window that closes
        with no new bond (it timed out, or the hub already holds 4 bonds)
        leaves the device as it was. Starting again while this device's own
        window is open answers `202` with its status. Bluetooth devices only
        (`404 not_found` for any other device); `409 busy` while another
        device's window is open; `503 integration_unavailable` when Bluetooth
        isn't working, `503 busy` when it can't take the request right now
        (try again).
      parameters:
        - name: window_s
          in: query
          required: false
          schema: {type: integer, minimum: 30, maximum: 300, default: 120}
      responses:
        '202':
          description: Pairing window open
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BluetoothStatus'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/Unavailable'}
    get:
      tags: [admin]
      operationId: getDevicePairing
      x-hubbo-role: admin
      summary: A Bluetooth device's pairing and connection status
      description: The same status as the device's `bluetooth` field.
      responses:
        '200':
          description: Its status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BluetoothStatus'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      tags: [admin]
      operationId: cancelDevicePairing
      x-hubbo-role: admin
      summary: Close this device's pairing window
      description: Keeps any bond it had. `204` when no window was open for it.
      responses:
        '204': {description: Closed (or no window was open)}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /admin/devices/{device_id}/pairing:
    parameters:
      - $ref: '#/components/parameters/DeviceIdPath'
    delete:
      tags: [admin]
      operationId: forgetDevicePairing
      x-hubbo-role: admin
      summary: Forget a Bluetooth device's host
      description: |
        Closes its window if open and deletes only this device's bond
        (disconnecting that host). The device stays, `not_paired`. Remove
        Hubbo on the host too. `204` when it had no bond. Deleting the device
        forgets it as well.
      responses:
        '204': {description: Forgotten}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /admin/remote:
    get:
      tags: [admin]
      operationId: getRemoteConfig
      x-hubbo-role: admin
      summary: Remote radio endpoint and state
      responses:
        '200':
          description: Radio
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemoteConfig'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /admin/remote/endpoint:
    put:
      tags: [admin]
      operationId: setRemoteEndpoint
      x-hubbo-role: admin
      x-hubbo-max-body: 1024
      summary: Listen on a known Harmony Hub endpoint
      description: |
        For a remote whose Hub address is already known (e.g. from an earlier
        scan or the console's `radio show`): the same validation as the
        console's `radio set`. Channel 0-124; address up to 40 bits in hex
        (`0x` optional), not all zeros or ones, and its low byte not `55` or
        `AA`. Saved, and used at once. `409 busy` while a scan runs; `503`
        if the radio isn't working.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RemoteEndpointUpdate'}
      responses:
        '200':
          description: Listening
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemoteConfig'}
        '400': {$ref: '#/components/responses/MalformedJson'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /admin/remote/pair:
    get:
      tags: [admin]
      operationId: getRemotePairing
      x-hubbo-role: admin
      summary: Remote pairing state
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '200':
          description: State
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemotePairStatus'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [admin]
      operationId: startRemotePairing
      x-hubbo-role: admin
      summary: Scan for a Harmony Hub's radio address
      description: |
        Start scanning, then press the existing Harmony Hub's pair button. Hubbo
        learns the Hub's address and channel, saves them and listens as that
        Hub. The scan gives up after 120 s. Poll `GET /admin/remote/pair`.
        `409 busy` if a scan is already running; `503` if the radio isn't
        working.
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '202':
          description: Scanning
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemotePairStatus'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [admin]
      operationId: cancelRemotePairing
      x-hubbo-role: admin
      summary: Stop scanning (keeps the current pairing)
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '204': {description: Stopped}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /admin/account/password:
    put:
      tags: [admin]
      operationId: changeAdminPassword
      x-hubbo-role: admin
      x-hubbo-max-body: 1024
      summary: Change the admin password
      description: Ends every other session.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordChange'}
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '400': {$ref: '#/components/responses/MalformedJson'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '204': {description: Changed}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /admin/tokens:
    get:
      tags: [admin]
      operationId: listTokens
      x-hubbo-role: admin
      summary: API tokens (never the secret)
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '200':
          description: Tokens
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [admin]
      operationId: createToken
      x-hubbo-role: admin
      x-hubbo-returns-secret: true
      x-hubbo-max-body: 1024
      summary: Create an API token (secret shown once)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenCreate'}
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '400': {$ref: '#/components/responses/MalformedJson'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '201':
          description: Created. Store `token` now; it cannot be read again.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenCreated'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /admin/tokens/{token_id}:
    parameters:
      - name: token_id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/TokenId'}
    delete:
      tags: [admin]
      operationId: revokeToken
      x-hubbo-role: admin
      summary: Revoke an API token (effective immediately)
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '204': {description: Revoked}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /admin/backup:
    get:
      tags: [admin]
      operationId: downloadBackup
      x-hubbo-role: admin
      summary: Download a backup of non-secret configuration
      description: |
        Excludes the admin password, API tokens, integration secrets and BLE bonds.
        `X-Hubbo-Backup` says what the download is:

        * `config`: the running configuration as a `Backup` (`application/json`,
          `hubbo-backup-<date>.json`).
        * `blocked-raw`: while `/status` `config.state` is `blocked` nothing runs,
          so there is no configuration to back up. Instead the download is the
          saved config record's bytes exactly as stored, untouched
          (`application/octet-stream`, `hubbo-backup-BLOCKED-<date>.json`). It's
          a `hubbo-config` document, not a `Backup`, and may be from newer
          firmware. Keep it before a factory reset: `POST /admin/restore` takes it
          back once the firmware can read it.

        While `config.state` is `storage_unavailable`: if the config loaded
        (or was last saved) fine and the store failed later, the running config
        is the last acknowledged save and is exported as usual. Only when the
        load itself couldn't read the store is there nothing trustworthy to
        export: `503 storage_unavailable`, never an empty backup.
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '501': {$ref: '#/components/responses/NotImplemented'}
        '200':
          description: Backup archive, or the blocked config record (see `X-Hubbo-Backup`)
          headers:
            Content-Disposition:
              schema: {type: string}
            X-Hubbo-Backup:
              required: true
              schema: {type: string, enum: [config, blocked-raw]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Backup'}
            application/octet-stream:
              schema: {type: string, format: binary}
        '409':
          description: |
            `config_blocked`: the config is blocked and there is no intact saved
            record to export (it's damaged, or was never saved).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /admin/restore:
    post:
      tags: [admin]
      operationId: restoreBackup
      x-hubbo-role: admin
      x-hubbo-max-body: 655360
      summary: Validate and atomically restore a backup
      description: |
        Validates and migrates the whole archive, then replaces devices,
        activities and non-secret integration settings in one commit. On any
        error nothing changes. `dry_run=true` validates only. Secrets are not
        in backups: `requires` lists what to re-enter or re-pair.

        A restore never starts or stops an activity. The active activity stays
        active if the restored config still has an activity with its id;
        otherwise the hub becomes inactive without running any startup or
        shutdown commands.

        The body is a `Backup`, or a `blocked-raw` download from
        `GET /admin/backup` (a `hubbo-config` record). A record is accepted only
        if this firmware can read it (migrating older versions). One from newer
        firmware, or one this firmware can't migrate, is refused with
        `422 validation_failed` (detail `unsupported_schema` at
        `/schema_version`); one that doesn't parse or compile with
        `422 validation_failed` and its issues. Either way nothing changes.

        Every restored object is stamped with the new config generation, so
        revisions in the backup are ignored (missing or 0 is fine) and any
        client holding an older revision gets 409. Restore works while the
        config is `blocked`.
      parameters:
        - name: dry_run
          in: query
          required: false
          schema: {type: boolean, default: false}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RestoreRequest'}
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '400': {$ref: '#/components/responses/MalformedJson'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '501': {$ref: '#/components/responses/NotImplemented'}
        '200':
          description: Restored (or would restore, for a dry run)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RestoreResult'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /admin/reset:
    post:
      tags: [admin]
      operationId: resetConfiguration
      x-hubbo-role: admin
      summary: Reset configuration
      description: |
        Reset configuration: replaces devices, activities, global bindings
        and integration settings with the first-boot defaults (the built-in
        integrations and one global binding, `off:tap` → system `off`), stamped with a new
        generation (so every client's old revisions get 409). Works while the
        config is `blocked`. The login, tokens, the Home Assistant token and
        pairings are kept (`POST /admin/factory-reset` erases those too). Like a restore it never
        starts or stops an activity: the active activity stays active if the
        defaults have an activity with its id, otherwise the hub becomes
        inactive without running any startup or shutdown commands.
      responses:
        '200':
          description: Reset
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfigState'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /admin/factory-reset:
    post:
      tags: [admin]
      operationId: factoryReset
      x-hubbo-role: admin
      summary: Factory reset
      description: |
        Erases everything and restarts into first-run setup: the login, every
        API token, the Home Assistant token, BLE bonds, the remote endpoint
        and the whole configuration. Answers `202` first; the hub then stops
        answering for a few seconds and comes back with `auth_state` `fresh`
        (every session gone), so the next step is `POST /auth/setup`. The
        paired hosts (an Apple TV, say) still list the old pairing: forget
        "Hubbo" on each before pairing again. Refused while a firmware update is running.
      responses:
        '202':
          description: The reset will start once this response is sent
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: A firmware update is running (`update_in_progress`)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /admin/firmware:
    get:
      tags: [admin]
      operationId: getFirmwareStatus
      x-hubbo-role: admin
      summary: Firmware version and update state
      description: |
        Poll it during an update. After `rebooting`, the hub stops answering
        for a few seconds, then comes back `idle` with the new `version` (and
        every session gone: log in again).
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '200':
          description: Firmware status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FirmwareStatus'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /admin/firmware/update:
    post:
      tags: [admin]
      operationId: updateFirmware
      x-hubbo-role: admin
      x-hubbo-max-body: 6553600
      summary: Upload a firmware image
      description: |
        The body is the app image (`firmware.bin` from the build, not the
        merged factory image), sent whole with `Content-Length`. The hub
        checks all of it before erasing anything: it fits the inactive OTA
        slot, it's an ESP32-S3 app image for this chip revision, it carries the
        Hubbo marker for this board and partition layout, and its appended
        SHA-256 matches. Then it answers `202` and writes the image in the
        background (`GET /admin/firmware` shows the progress), sets it to boot
        and reboots. There's no rollback. During the write the remote may lag
        for up to about 30 s. The body limit is the OTA slot size.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, contentEncoding: binary}
      responses:
        '202':
          description: The image passed every check; the write has started
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FirmwareStatus'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: An update is already running, or the hub is rebooting (`update_in_progress`)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '411':
          description: No `Content-Length` header (`length_required`)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415':
          description: Body is not `Content-Type application/octet-stream` (`unsupported_media_type`)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: |
            Refused before anything was written. `wrong_board`: a Hubbo image
            for another board. `invalid_image`: not an app image (a merged
            factory .bin isn't one), the wrong chip, not a Hubbo image, another
            partition layout, or a checksum that doesn't match (the message
            says which).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: This hub can't take an update now, e.g. no memory for the image (`unavailable`, `busy`)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /admin/hub:
    get:
      tags: [admin]
      operationId: getHub
      x-hubbo-role: admin
      summary: The hub's name and hostname
      responses:
        '503': {$ref: '#/components/responses/Unavailable'}
        '200':
          description: The hub
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Hub'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [admin]
      operationId: updateHub
      x-hubbo-role: admin
      x-hubbo-max-body: 1024
      summary: Rename the hub
      description: |
        Spaces at either end are dropped, then the rest must be a `HubName`;
        otherwise `422 validation_failed` at `/name` (`required`, `too_long`
        or `invalid_name`). `hostname` follows the name (see `Hub`).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HubUpdate'}
      responses:
        '200':
          description: Renamed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Hub'}
        '400': {$ref: '#/components/responses/MalformedJson'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /admin/restart:
    post:
      tags: [admin]
      operationId: restartHub
      x-hubbo-role: admin
      summary: Restart the hub
      description: |
        Answers `202` first; the hub then stops answering for a few seconds
        and comes back with everything it had saved. Sessions don't survive
        a restart: log in again. API tokens keep working. Refused while a
        firmware update is running.
      responses:
        '202':
          description: The restart will start once this response is sent
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Empty'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: A firmware update is running (`update_in_progress`)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: hubbo_session
      description: Admin browser session (7 days, or until the hub reboots).
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: hbt_<id>_<secret>
      description: API token from `POST /admin/tokens`, or (simulator only) nothing at all.

  headers:
    SessionCookie:
      description: '`hubbo_session=<opaque>; Path=/; HttpOnly; SameSite=Strict[; Secure]`'
      schema: {type: string}

  parameters:
    DeviceIdPath:
      name: device_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/DeviceId'}
    ActivityIdPath:
      name: activity_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ActivityId'}
    ProfileIdPath:
      name: profile_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ProfileId'}
    IntegrationIdPath:
      name: integration_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/IntegrationId'}
    RevisionQuery:
      name: revision
      in: query
      required: true
      description: Revision the caller last read.
      schema: {$ref: '#/components/schemas/Revision'}

  responses:
    MalformedJson:
      description: Body is not valid JSON (`malformed_json`)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthenticated:
      description: No or invalid credentials (`unauthenticated`)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: 'Not allowed: `forbidden` (an API token on an admin operation) or `csrf_failed` (a cross-site `Origin`)'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: No such resource (`not_found`)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: '`revision_conflict`, `device_in_use`, `activity_in_use`, `config_blocked`, `limit_reached`, `busy`, `setup_already_done`, `setup_required`, `details_required`'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PayloadTooLarge:
      description: Body over the operation's limit (`payload_too_large`)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ValidationFailed:
      description: Well-formed JSON that breaks the contract (`validation_failed`); see `details`
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnsupportedMediaType:
      description: Body is not `Content-Type application/json` (`unsupported_media_type`)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InternalError:
      description: Could not save (`internal_error`); nothing changed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotImplemented:
      description: Not implemented on this firmware yet (`not_implemented`); nothing happened
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unavailable:
      description: |
        Integration not connected, the engine is busy, the config store can't
        be written, or stored credentials can't be read so nobody can be
        authenticated, or (firmware) this hub has no update support
        (`integration_unavailable`, `busy`, `storage_unavailable`, `unavailable`).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}

  schemas:
    # ---------- identifiers ----------
    DeviceId:
      type: string
      pattern: '^dev_[a-z0-9_]{1,28}$'
      examples: [dev_apple_tv]
    ActivityId:
      type: string
      pattern: '^act_[a-z0-9_]{1,28}$'
      examples: [act_watch_apple_tv]
    NullableActivityId:
      oneOf:
        - {$ref: '#/components/schemas/ActivityId'}
        - {type: 'null'}
    NullableDeviceId:
      oneOf:
        - {$ref: '#/components/schemas/DeviceId'}
        - {type: 'null'}
    TokenId:
      type: string
      pattern: '^tok_[a-z0-9]{8}$'
    IntegrationId:
      type: string
      pattern: '^[a-z][a-z0-9_]{0,31}$'
      examples: [ha_main, ble, system]
    IntegrationType:
      type: string
      enum: [system, ble_hid, home_assistant, mqtt]
    CommandId:
      description: |
        Hubbo command identifier. HA commands are namespaced by entity domain
        (`media_player.volume_set`); BLE and system commands are bare (`key_tap`, `wait`).
        It names an allowlisted Hubbo command, not a Home Assistant service.
      type: string
      pattern: '^[a-z][a-z0-9_]{0,31}(\.[a-z][a-z0-9_]{0,31})?$'
      examples: [media_player.volume_set, key_tap, wait]
    Revision:
      type: integer
      minimum: 1
      maximum: 4294967295
    Name:
      type: string
      minLength: 1
      maxLength: 64
    Timestamp:
      description: RFC 3339 UTC, or null when the hub has no wall-clock time yet.
      type: [string, 'null']
      format: date-time
    Button:
      type: string
      enum: [up, down, left, right, select, menu, number_1, number_2, number_3, number_4, number_5, number_6, number_7, number_8, number_9, number_0, number_dot_dash, number_enter, 'off', music, tv, movie, light_1, light_2, plus, minus, switch_1, switch_2, red, green, yellow, blue, dvr, guide, info, back, exit, volume_up, volume_down, mute, channel_up, channel_down, skip_backward, skip_forward, play, pause, record, stop]
    EventKind:
      type: string
      enum: [down, up, tap, hold]
    Trigger:
      description: '`<button>:<event>`'
      type: string
      pattern: '^(up|down|left|right|select|menu|number_1|number_2|number_3|number_4|number_5|number_6|number_7|number_8|number_9|number_0|number_dot_dash|number_enter|off|music|tv|movie|light_1|light_2|plus|minus|switch_1|switch_2|red|green|yellow|blue|dvr|guide|info|back|exit|volume_up|volume_down|mute|channel_up|channel_down|skip_backward|skip_forward|play|pause|record|stop):(down|up|tap|hold)$'
      examples: ['volume_up:down', 'info:hold']

    # ---------- errors ----------
    ErrorCode:
      type: string
      enum:
        - malformed_json
        - validation_failed
        - unsupported_media_type
        - payload_too_large
        - method_not_allowed
        - length_required
        - unauthenticated
        - invalid_credentials
        - forbidden
        - csrf_failed
        - not_found
        - revision_conflict
        - device_in_use
        - activity_in_use
        - config_blocked
        - storage_unavailable
        - limit_reached
        - busy
        - setup_required
        - setup_already_done
        - details_required
        - update_in_progress
        - invalid_image
        - wrong_board
        - unavailable
        - integration_unavailable
        - not_implemented
        - internal_error
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [path, code, message]
      properties:
        path:
          description: JSON Pointer into the request body ('' for the whole body).
          type: string
          maxLength: 160
        code:
          description: |
            Core validation codes (`errorCodeName()` in core/src/domain/error.cpp)
            plus request-level codes (`required`, `unknown_field`, `wrong_type`,
            `too_long`, `pattern`, `forbidden_param`, `referenced`, `id_mismatch`,
            `weak_password`).
          type: string
          enum: [required, unknown_field, wrong_type, too_long, pattern, forbidden_param, referenced, id_mismatch, weak_password, hold_not_allowed, unpaired_hold, integration_disabled, invalid_id, invalid_name, invalid_command_id, duplicate_id, unknown_integration, unknown_device, device_required, device_not_allowed, integration_mismatch, unknown_command, unknown_param, duplicate_param, missing_param, invalid_param_type, param_out_of_range, invalid_enum_value, too_many_params, invalid_trigger, duplicate_trigger, unknown_activity, misplaced_transition, too_many_actions, too_many_activities, too_many_devices, capacity_exceeded, unsupported_schema, unknown_profile, unknown_kind, sequence_only, too_deep, template_not_supported]
        message:
          type: string
          maxLength: 200
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {$ref: '#/components/schemas/ErrorCode'}
            message:
              description: Human readable; never contains secrets.
              type: string
              maxLength: 200
            details:
              type: array
              maxItems: 32
              items: {$ref: '#/components/schemas/ErrorDetail'}
            current_revision:
              description: Present with `revision_conflict`.
              $ref: '#/components/schemas/Revision'
            docs:
              description: |
                Where to read how the API works. Present when a request is
                refused for having no valid credentials (`401 unauthenticated`), and
                on the `404` for a path the API doesn't have.
              type: string
              const: /api/v1/agent.md

    # ---------- status ----------
    AuthState:
      description: |
        What the hub knows about its credentials. "Can't read" is never
        "doesn't exist": only `fresh` (the store is readable and holds no
        admin) allows `POST /auth/setup`.
        Read once at boot. `ok`: loaded. `unavailable`: the store couldn't be
        read or holds damaged credentials; logins, setup and authenticated
        requests get `503 storage_unavailable`. Recovery is a reboot or the
        wipe (`bin/hubbo ota <ip> --wipe`).
      type: string
      enum: [fresh, ok, unavailable]
    ConfigState:
      description: |
        Health of the saved configuration.
        `ok`: loaded and running. `fresh`: nothing was saved yet, the defaults
        are running. `blocked`: a saved config exists but can't be used
        (`reason`, human-readable: from newer firmware, a failed migration,
        not valid JSON, doesn't compile, or damaged: its slots exist but none
        is intact); nothing is
        active, every edit is refused with `409 config_blocked`, and only
        `POST /admin/restore` or `POST /admin/reset` may write. A backup
        while blocked is the saved record's raw bytes (`blocked-raw`), or
        `409 config_blocked` when it's damaged.
        `storage_unavailable`: the store can't be written; edits get
        `503 storage_unavailable`.
      type: object
      additionalProperties: false
      required: [state, generation]
      properties:
        state: {type: string, enum: [ok, fresh, blocked, storage_unavailable]}
        reason: {type: string, maxLength: 120}
        generation:
          description: The saved config generation (0 when nothing is saved).
          type: integer
          minimum: 0
    AuthMode:
      description: '`simulator_no_auth` only ever appears on the native simulator; the UI shows AUTH DISABLED — SIMULATOR.'
      type: string
      enum: [enforced, simulator_no_auth]
    IntegrationState:
      description: |
        Home Assistant: `not_configured` (no URL or token), `connecting`,
        `authenticating`, `connected`, `auth_failed` (the token was refused;
        no retry until the settings change) or `unreachable` (retrying with
        backoff, 1 s doubling to 60 s). BLE: `connected` / `disconnected`.
        MQTT: `not_configured` (no host), `connecting`, `connected`,
        `auth_failed` (the broker refused the username or password; it keeps
        retrying) or `unreachable` (retrying). Any integration: `disabled`,
        `error`.
      type: string
      enum: [not_configured, disabled, connecting, authenticating, connected, auth_failed, unreachable, disconnected, error]
    Status:
      type: object
      additionalProperties: false
      required: [hubbo, uptime_s, auth_mode, auth_state, config, active_activity_id, selected_slot, network, remote, integrations, diagnostics]
      properties:
        hubbo:
          type: object
          additionalProperties: false
          required: [name, version, board]
          properties:
            name: {$ref: '#/components/schemas/HubName'}
            version: {type: string, maxLength: 32}
            build: {type: string, maxLength: 64}
            board: {type: string, maxLength: 32}
        uptime_s: {type: integer, minimum: 0}
        time: {$ref: '#/components/schemas/Timestamp'}
        auth_mode: {$ref: '#/components/schemas/AuthMode'}
        auth_state: {$ref: '#/components/schemas/AuthState'}
        config: {$ref: '#/components/schemas/ConfigState'}
        active_activity_id:
          $ref: '#/components/schemas/NullableActivityId'
        selected_slot:
          description: |
            The smart button slot `plus`/`minus` act on: the slot whose button
            was pressed last. `light_1` after a reboot.
          allOf: [{$ref: '#/components/schemas/SmartSlotId'}]
        network:
          type: object
          additionalProperties: false
          required: [link]
          properties:
            link: {type: string, enum: [up, down]}
            ip: {type: string, format: ipv4}
            hostname:
              description: The `.local` hostname the hub advertises, as `GET /admin/hub` shows it.
              type: string
              maxLength: 63
        remote: {$ref: '#/components/schemas/RemoteStatus'}
        integrations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, type, state]
            properties:
              id: {$ref: '#/components/schemas/IntegrationId'}
              type: {$ref: '#/components/schemas/IntegrationType'}
              state: {$ref: '#/components/schemas/IntegrationState'}
              detail:
                description: The same as the integrations list's `detail`, so one poll shows both.
                type: string
                maxLength: 120
        diagnostics: {$ref: '#/components/schemas/Diagnostics'}
    LatencyStats:
      type: object
      additionalProperties: false
      required: [count, p50_ms, p95_ms, p99_ms]
      properties:
        count: {type: integer, minimum: 0}
        p50_ms: {type: number, minimum: 0}
        p95_ms: {type: number, minimum: 0}
        p99_ms: {type: number, minimum: 0}
    Diagnostics:
      type: object
      additionalProperties: false
      properties:
        heap_free: {type: integer, minimum: 0}
        heap_min_free: {type: integer, minimum: 0}
        psram_free: {type: integer, minimum: 0}
        queue_overflows: {type: integer, minimum: 0}
        dispatch_latency:
          description: RF receive to adapter hand-off.
          oneOf:
            - {$ref: '#/components/schemas/LatencyStats'}
            - {type: 'null'}
        last_errors:
          type: array
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [code, message]
            properties:
              at: {$ref: '#/components/schemas/Timestamp'}
              source: {type: string, maxLength: 32}
              code: {type: string, maxLength: 48}
              message: {type: string, maxLength: 200}

    RemoteStatus:
      type: object
      additionalProperties: false
      required: [paired, last_packet_age_ms]
      properties:
        paired: {type: boolean}
        channel: {type: integer, minimum: 0, maximum: 125}
        last_packet_age_ms:
          type: [integer, 'null']
          minimum: 0
        held:
          type: array
          items: {$ref: '#/components/schemas/Button'}
        last_event:
          oneOf:
            - type: object
              additionalProperties: false
              required: [button, kind, age_ms]
              properties:
                button: {$ref: '#/components/schemas/Button'}
                kind: {$ref: '#/components/schemas/EventKind'}
                age_ms: {type: integer, minimum: 0}
                timed_out: {type: boolean}
            - {type: 'null'}
        counters:
          type: object
          additionalProperties: false
          properties:
            bad_checksum: {type: integer, minimum: 0}
            unknown_code: {type: integer, minimum: 0}
    RemoteButtons:
      type: object
      additionalProperties: false
      required: [buttons, event_kinds, hold_ms]
      properties:
        buttons:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, group]
            properties:
              name: {$ref: '#/components/schemas/Button'}
              group: {type: string, enum: [keypad, media_home]}
              label: {type: string, maxLength: 24}
        event_kinds:
          type: array
          items: {$ref: '#/components/schemas/EventKind'}
        hold_ms:
          description: Threshold between `tap` and `hold`.
          type: integer
          minimum: 1

    # ---------- auth ----------
    Username:
      type: string
      pattern: '^[A-Za-z0-9_.-]{1,32}$'
    NewPassword:
      type: string
      writeOnly: true
      minLength: 10
      maxLength: 128
    SetupRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {$ref: '#/components/schemas/Username'}
        password: {$ref: '#/components/schemas/NewPassword'}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, maxLength: 32}
        password: {type: string, writeOnly: true, maxLength: 128}
    PasswordChange:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: {type: string, writeOnly: true, maxLength: 128}
        new_password: {$ref: '#/components/schemas/NewPassword'}
    Session:
      type: object
      additionalProperties: false
      required: [authenticated, role, setup_required, auth_state, auth_mode]
      properties:
        authenticated: {type: boolean}
        role:
          type: [string, 'null']
          enum: [admin, token, null]
        username: {type: string, maxLength: 32}
        expires_in_s:
          type: integer
          minimum: 0
        setup_required:
          description: True only when `auth_state` is `fresh`.
          type: boolean
        auth_state: {$ref: '#/components/schemas/AuthState'}
        config_state:
          description: '`ConfigState.state`, so the UI can warn before login.'
          type: string
          enum: [ok, fresh, blocked, storage_unavailable]
        auth_mode: {$ref: '#/components/schemas/AuthMode'}
    TokenCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {$ref: '#/components/schemas/Name'}
    TokenFields:
      description: Shared by TokenSummary and TokenCreated (open; each closes it).
      type: object
      required: [id, name, hint, created_at, last_used_at]
      properties:
        id: {$ref: '#/components/schemas/TokenId'}
        name: {$ref: '#/components/schemas/Name'}
        hint:
          description: Non-secret prefix for recognising the token (`hbt_<id>_`).
          type: string
          maxLength: 20
        created_at: {$ref: '#/components/schemas/Timestamp'}
        last_used_at: {$ref: '#/components/schemas/Timestamp'}
    TokenSummary:
      allOf: [{$ref: '#/components/schemas/TokenFields'}]
      unevaluatedProperties: false
    TokenCreated:
      description: '`TokenSummary` plus the secret.'
      allOf: [{$ref: '#/components/schemas/TokenFields'}]
      required: [token]
      properties:
        token:
          description: The only time the secret is returned.
          type: string
          pattern: '^hbt_[a-z0-9]{8}_[A-Za-z0-9_-]{43}$'
      unevaluatedProperties: false
    TokenList:
      type: object
      additionalProperties: false
      required: [tokens]
      properties:
        tokens:
          type: array
          maxItems: 16
          items: {$ref: '#/components/schemas/TokenSummary'}

    # ---------- capabilities ----------
    ParamSpec:
      description: |
        Schema of one command parameter. Scalars only; nested objects and arrays
        are never accepted as parameter values. `label`, `unit` and `default`
        (and `description`) are display metadata, present when the integration gives them
        (Home Assistant services: HA's English names, units and defaults;
        Bluetooth: the hub's). A `default` is what's used when an optional
        param is left out.
      type: object
      additionalProperties: false
      required: [name, type, required]
      properties:
        name: {$ref: '#/components/schemas/ParamName'}
        label: {type: string, maxLength: 48}
        description:
          description: A tooltip (Home Assistant's field description, shortened).
          type: string
          maxLength: 160
        type:
          description: Same names as core `paramTypeName()`. `activity_ref` takes an activity ID.
          type: string
          enum: [bool, int, number, enum, activity_ref]
        required: {type: boolean}
        minimum: {type: number}
        maximum: {type: number}
        step: {type: number, exclusiveMinimum: 0}
        unit: {type: string, maxLength: 16}
        options:
          description: Allowed values for `enum` (exact match).
          type: array
          maxItems: 128
          items: {type: string, maxLength: 64}
        default: {type: [number, boolean, string]}
    Command:
      type: object
      additionalProperties: false
      required: [command_id, label, effect, params]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        effect:
          description: |
            `momentary`: a one-shot command. `hold`: leaves something held
            that must be released (e.g. `key_down`). `wait`: pauses a
            startup or shutdown sequence (`wait_connected {timeout_ms}`,
            default 15000: until the Bluetooth host is connected or the
            time runs out; either way the sequence goes on). Execute accepts
            only `momentary` (a `hold` gets 422 `hold_not_allowed`, a `wait`
            422 `sequence_only`); bindings may use `hold` paired with its
            release (down/up), and never `wait`.
          type: string
          enum: [momentary, hold, wait]
        group:
          description: |
            Bluetooth key choices only (not `wait_connected`, nor Home
            Assistant commands): where the command belongs in a picker,
            shown in this order. `remote`: the device's own commands, from
            its profile, by name (`press`, `press_down`, `press_up`, with
            param `command`). `keys`: every named key
            on every Bluetooth device (`key_tap`, `key_down`, `key_up`).
            `custom`: a raw consumer usage, 1-1023 (`usage_tap`,
            `usage_down`, `usage_up`). On a Home Assistant device, `custom`
            is `call_service` (a Home Assistant action).
          type: string
          enum: [remote, keys, custom]
        services:
          description: |
            `call_service` only: the services a Home Assistant action can send
            to this device (its snapshot's `custom_services`), with field hints.
          type: array
          minItems: 1
          maxItems: 16
          items: {$ref: '#/components/schemas/HaCustomService'}
        label: {type: string, maxLength: 48}
        description: {type: string, maxLength: 200}
        params:
          type: array
          maxItems: 4
          items: {$ref: '#/components/schemas/ParamSpec'}
    DeviceCapabilities:
      type: object
      additionalProperties: false
      required: [device_id, integration_id, commands]
      properties:
        device_id: {$ref: '#/components/schemas/DeviceId'}
        integration_id: {$ref: '#/components/schemas/IntegrationId'}
        commands:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/Command'}

    # ---------- actions ----------
    ParamName:
      type: string
      pattern: '^[a-z][a-z0-9_]{0,31}$'
      not:
        description: Target-like names are refused outright, whatever the command.
        enum: [entity_id, device_id, area_id, floor_id, label_id, target, data, service, service_data, domain]
    ActionParams:
      description: Typed scalar parameters, checked against the command's `ParamSpec` list.
      type: object
      maxProperties: 4
      propertyNames: {$ref: '#/components/schemas/ParamName'}
      additionalProperties:
        oneOf:
          - type: boolean
          - type: number
          - type: string
            maxLength: 64
    Action:
      description: |
        `{integration_id, device_id, command_id, params}`. `device_id` must be a
        registered device owned by `integration_id`; it is `null` only for the
        deviceless `system` commands: `wait`, `activate` and `off`. `activate`
        and `off` may only be the last action of a binding, never in
        startup/shutdown. A Home Assistant action (`call_service`) adds
        `call` (required with it, refused on any other command: `unknown_field`).
      type: object
      additionalProperties: false
      required: [integration_id, device_id, command_id, params]
      properties:
        integration_id: {$ref: '#/components/schemas/IntegrationId'}
        device_id:
          $ref: '#/components/schemas/NullableDeviceId'
        command_id: {$ref: '#/components/schemas/CommandId'}
        params: {$ref: '#/components/schemas/ActionParams'}
        call: {$ref: '#/components/schemas/HaServiceCall'}
      if: {required: [command_id], properties: {command_id: {const: call_service}}}
      then:
        required: [call]
        properties:
          device_id: {$ref: '#/components/schemas/DeviceId'}
          params: {maxProperties: 0}
      else: {not: {required: [call]}}
    ActionSequence:
      type: array
      maxItems: 32
      items: {$ref: '#/components/schemas/Action'}
    Bindings:
      description: Trigger → actions. Absent triggers are unbound (no-op).
      type: object
      maxProperties: 192
      propertyNames: {$ref: '#/components/schemas/Trigger'}
      additionalProperties:
        type: array
        minItems: 1
        maxItems: 32
        items: {$ref: '#/components/schemas/Action'}
    ExecuteRequest:
      description: |
        `call` only for `call_service` (a Home Assistant action), and required
        there; detail paths start at the body (`/call/data/...`).
      type: object
      additionalProperties: false
      required: [params]
      properties:
        params: {$ref: '#/components/schemas/ActionParams'}
        call: {$ref: '#/components/schemas/HaServiceCall'}
    ExecuteResult:
      type: object
      additionalProperties: false
      required: [status, device_id, command_id, elapsed_ms]
      properties:
        status:
          description: |
            `accepted`: the integration took the command (not proof of
            physical effect). `failed`: it refused or couldn't send it (see
            `message`). `timeout`: no answer within the action timeout (5 s);
            `message` is then `adapter_timeout`.
          type: string
          enum: [accepted, failed, timeout]
        device_id: {$ref: '#/components/schemas/DeviceId'}
        command_id: {$ref: '#/components/schemas/CommandId'}
        elapsed_ms: {type: integer, minimum: 0}
        message:
          description: |
            Why it failed or timed out, as a core error name:
            `adapter_unavailable` (the integration isn't connected),
            `adapter_failed` (it refused the call), `adapter_timeout` (no
            answer within the action timeout), `entity_not_found` (the HA
            entity is missing from the latest discovery, see `availability:
            stale`; not sent), `state_unavailable` (a step needs the entity's
            current value, such as a cover's `current_position`, and Home
            Assistant reports none; not sent), `queue_full`.
          type: string
          maxLength: 200

    # ---------- activities ----------
    ActivityFields:
      description: Shared by the activity schemas (open; each closes it).
      type: object
      required: [name, startup, shutdown, bindings]
      properties:
        name: {$ref: '#/components/schemas/Name'}
        startup: {$ref: '#/components/schemas/ActionSequence'}
        shutdown: {$ref: '#/components/schemas/ActionSequence'}
        bindings: {$ref: '#/components/schemas/Bindings'}
    ActivityInput:
      description: Body for create.
      allOf: [{$ref: '#/components/schemas/ActivityFields'}]
      unevaluatedProperties: false
    ActivityReplace:
      description: |
        Body for replace and validate: an activity as read, so GET → edit → PUT
        works. `revision` is required for replace; validate ignores `id` and
        `revision`.
      allOf: [{$ref: '#/components/schemas/ActivityFields'}]
      properties:
        id: {$ref: '#/components/schemas/ActivityId'}
        schema_version: {type: integer, const: 1}
        revision: {$ref: '#/components/schemas/Revision'}
      unevaluatedProperties: false
    Activity:
      allOf: [{$ref: '#/components/schemas/ActivityFields'}]
      required: [id, schema_version, revision]
      properties:
        id: {$ref: '#/components/schemas/ActivityId'}
        schema_version: {type: integer, const: 1}
        revision: {$ref: '#/components/schemas/Revision'}
      unevaluatedProperties: false
    ActivityList:
      type: object
      additionalProperties: false
      required: [activities, active_activity_id]
      properties:
        activities:
          type: array
          maxItems: 16
          items: {$ref: '#/components/schemas/Activity'}
        active_activity_id:
          $ref: '#/components/schemas/NullableActivityId'
    BackupRevision:
      description: |
        Revision as found in a backup. Optional, and 0 is accepted: restore
        stamps every object with the new config generation anyway.
      type: integer
      minimum: 0
      maximum: 4294967295
    BackupActivity:
      allOf: [{$ref: '#/components/schemas/ActivityFields'}]
      required: [id]
      properties:
        id: {$ref: '#/components/schemas/ActivityId'}
        schema_version: {type: integer, const: 1}
        revision: {$ref: '#/components/schemas/BackupRevision'}
      unevaluatedProperties: false
    BackupGlobalBindings:
      type: object
      additionalProperties: false
      required: [bindings]
      properties:
        bindings: {$ref: '#/components/schemas/Bindings'}
        revision: {$ref: '#/components/schemas/BackupRevision'}
    GlobalBindings:
      type: object
      additionalProperties: false
      required: [bindings, revision]
      properties:
        bindings: {$ref: '#/components/schemas/Bindings'}
        revision: {$ref: '#/components/schemas/Revision'}

    # ---------- smart buttons ----------
    SmartSlotId:
      type: string
      enum: [light_1, light_2, switch_1, switch_2]
    SmartSlotDevices:
      description: All four, always. Each is the slot's device, or null.
      type: object
      additionalProperties: false
      required: [light_1, light_2, switch_1, switch_2]
      properties:
        light_1: {$ref: '#/components/schemas/NullableDeviceId'}
        light_2: {$ref: '#/components/schemas/NullableDeviceId'}
        switch_1: {$ref: '#/components/schemas/NullableDeviceId'}
        switch_2: {$ref: '#/components/schemas/NullableDeviceId'}
    SmartPressActions:
      type: object
      additionalProperties: false
      required: [tap, hold, release]
      properties:
        tap:
          type: array
          items: {$ref: '#/components/schemas/Action'}
        hold:
          description: When Hold fires (`GET /remote/buttons` `hold_ms`). It fires once.
          type: array
          items: {$ref: '#/components/schemas/Action'}
        release:
          description: |
            When the button comes up after a hold (never after a tap),
            including a release the hub supplies after a lost packet. Stops a
            moving cover.
          type: array
          items: {$ref: '#/components/schemas/Action'}
    SmartSlotActions:
      description: Empty lists mean the slot does nothing there (the global binding, if any, applies).
      type: object
      additionalProperties: false
      required: [button, plus, minus]
      properties:
        button:
          description: The slot's own button.
          allOf: [{$ref: '#/components/schemas/SmartPressActions'}]
        plus:
          description: What `plus` does while this slot is selected.
          allOf: [{$ref: '#/components/schemas/SmartPressActions'}]
        minus:
          description: What `minus` does while this slot is selected.
          allOf: [{$ref: '#/components/schemas/SmartPressActions'}]
    SmartButtonsInput:
      type: object
      additionalProperties: false
      required: [slots, revision]
      properties:
        slots: {$ref: '#/components/schemas/SmartSlotDevices'}
        revision: {$ref: '#/components/schemas/Revision'}
    SmartButtons:
      type: object
      additionalProperties: false
      required: [slots, actions, revision]
      properties:
        slots: {$ref: '#/components/schemas/SmartSlotDevices'}
        actions:
          description: Each slot's actions, derived from its device. Read-only.
          type: object
          additionalProperties: false
          required: [light_1, light_2, switch_1, switch_2]
          properties:
            light_1: {$ref: '#/components/schemas/SmartSlotActions'}
            light_2: {$ref: '#/components/schemas/SmartSlotActions'}
            switch_1: {$ref: '#/components/schemas/SmartSlotActions'}
            switch_2: {$ref: '#/components/schemas/SmartSlotActions'}
        revision: {$ref: '#/components/schemas/Revision'}
    BackupSmartButtons:
      type: object
      additionalProperties: false
      required: [slots]
      properties:
        slots: {$ref: '#/components/schemas/SmartSlotDevices'}
        revision: {$ref: '#/components/schemas/BackupRevision'}
    ValidationResult:
      type: object
      additionalProperties: false
      required: [valid, errors]
      properties:
        valid: {type: boolean}
        errors:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/ErrorDetail'}
    TransitionResult:
      description: What an activate/off did, phase by phase.
      type: object
      additionalProperties: false
      required: [switched, active_activity_id, previous_activity_id, generation, startup, shutdown]
      properties:
        switched:
          description: The active activity changed (or, for activate, was re-selected). Never retry when true.
          type: boolean
        active_activity_id:
          $ref: '#/components/schemas/NullableActivityId'
        previous_activity_id:
          $ref: '#/components/schemas/NullableActivityId'
        generation:
          description: Transition counter; delayed actions from older generations are dropped.
          type: integer
          minimum: 0
        startup: {$ref: '#/components/schemas/PhaseResult'}
        shutdown: {$ref: '#/components/schemas/PhaseResult'}
    PhaseResult:
      description: |
        One sequence of a transition. `none`: the phase doesn't apply (activate
        has no shutdown, off has no startup, off with nothing active).
        `rejected`: the hub switched but this sequence did not run; `reason`
        says why (e.g. `queue_full`).
      type: object
      additionalProperties: false
      required: [status, queued_actions]
      properties:
        status: {type: string, enum: [queued, rejected, none]}
        queued_actions: {type: integer, minimum: 0}
        reason: {type: string, maxLength: 48}

    # ---------- devices ----------
    DeviceKind:
      description: |
        A label, an icon and a browse category; nothing else depends on it.
        The list (with display labels) is `GET /kinds`, from the device
        profile spec's kinds.json. Anything else is `unknown_kind`.
      type: string
      enum: [tv, tv_vcr, tv_dvd, tv_dvd_vcr, tv_dvr, projector, streamer, set_top_box, cable_box, cable_dvr, satellite_box, console, computer, disc_player, dvd_recorder, dvd_vcr, dvd_recorder_vcr, vcr, laserdisc, home_theater, home_theater_vcr, receiver, amplifier, speaker, mini_system, tuner, cd_player, cd_changer, tape_deck, dat_deck, minidisc, portable_audio, hdmi_switch, climate, fan, cover, light, switch, smart_home_hub, scene, script, accessory, other]
    HomeAssistantProvider:
      type: object
      additionalProperties: false
      required: [type, entity_id]
      properties:
        type: {const: home_assistant}
        entity_id:
          description: Display and lookup only; never accepted in an execution request.
          type: string
          pattern: '^[a-z0-9_]+\.[a-z0-9_]+$'
          maxLength: 96
        unique_id:
          description: HA entity registry ID, preferred over entity_id because it survives renames.
          type: string
          maxLength: 64
    BleHidProvider:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: {const: ble_hid}
    Provider:
      oneOf:
        - $ref: '#/components/schemas/HomeAssistantProvider'
        - $ref: '#/components/schemas/BleHidProvider'
      discriminator:
        propertyName: type
        mapping:
          home_assistant: '#/components/schemas/HomeAssistantProvider'
          ble_hid: '#/components/schemas/BleHidProvider'
    DeviceFields:
      description: |
        Shared by the device schemas (open; each closes it). A Bluetooth
        device was added from a profile and carries `manufacturer`, `model`
        and `profile`; a Home Assistant device has none of them.
      type: object
      required: [id, name, integration_id, kind, provider, schema_version]
      properties:
        id: {$ref: '#/components/schemas/DeviceId'}
        name: {$ref: '#/components/schemas/Name'}
        integration_id: {$ref: '#/components/schemas/IntegrationId'}
        kind: {$ref: '#/components/schemas/DeviceKind'}
        provider: {$ref: '#/components/schemas/Provider'}
        manufacturer: {$ref: '#/components/schemas/ProfileDisplayName'}
        model: {$ref: '#/components/schemas/ProfileDisplayName'}
        profile: {$ref: '#/components/schemas/ProfileRef'}
        schema_version: {type: integer, const: 1}
      if:
        properties: {provider: {properties: {type: {const: ble_hid}}}}
      then:
        required: [manufacturer, model, profile]
      else:
        properties: {manufacturer: false, model: false, profile: false}
    ProfileFields:
      description: |
        A profile's content (open; each user closes it). Same names and
        shapes as the device profile spec.
      type: object
      properties:
        commands: {$ref: '#/components/schemas/ProfileCommands'}
        buttons: {$ref: '#/components/schemas/ProfileButtons'}
        power: {$ref: '#/components/schemas/ProfilePower'}
        timing: {$ref: '#/components/schemas/ProfileTiming'}
        inputs: {$ref: '#/components/schemas/ProfileInputs'}
        channels: {$ref: '#/components/schemas/ProfileChannels'}
    DeviceProfileContent:
      description: |
        A device's copy of its profile content (open). Bluetooth devices
        carry the profile's `commands` (and whichever of the other fields it
        has); Home Assistant devices carry none.
      allOf: [{$ref: '#/components/schemas/ProfileFields'}]
      if:
        properties: {provider: {properties: {type: {const: ble_hid}}}}
      then:
        required: [commands]
      else:
        properties: {commands: false, buttons: false, power: false, timing: false, inputs: false, channels: false}
    StoredDevice:
      description: |
        A device as configured (backups); no runtime state and no
        `platform` (it's `provider.type`). Restore checks a Bluetooth
        device's profile content as adding one does.
      allOf:
        - $ref: '#/components/schemas/DeviceFields'
        - $ref: '#/components/schemas/DeviceProfileContent'
      properties:
        revision: {$ref: '#/components/schemas/BackupRevision'}
        ha_capabilities: {$ref: '#/components/schemas/HaCapabilitySnapshot'}
      unevaluatedProperties: false
    HaCapabilitySnapshot:
      description: |
        Home Assistant devices only: what HA reported about the entity when it
        was registered or last re-linked. The hub derives the device's
        commands from it (docs/ha-capabilities.md) and re-checks it on
        restore: names, types and ranges are validated like any other input,
        and services must belong to `platform`. Not secret.
      type: object
      additionalProperties: false
      required: [platform, supported_features, services]
      properties:
        platform: {type: string, pattern: '^[a-z0-9_]{0,32}$'}
        supported_features: {type: integer, minimum: 0}
        source_list: {$ref: '#/components/schemas/HaOptionList'}
        sound_mode_list: {$ref: '#/components/schemas/HaOptionList'}
        supported_color_modes: {$ref: '#/components/schemas/HaOptionList'}
        min_color_temp_kelvin: {type: integer, minimum: 0, maximum: 100000}
        max_color_temp_kelvin: {type: integer, minimum: 0, maximum: 100000}
        preset_modes: {$ref: '#/components/schemas/HaOptionList'}
        percentage_step:
          description: A fan's percentage per speed (HA's 100 / speeds), rounded down.
          type: integer
          minimum: 1
          maximum: 100
        min_humidity:
          description: |
            A humidifier's target humidity range, whole percent: both or
            neither, with `min_humidity` below `max_humidity`. Neither: 0..100.
          type: integer
          minimum: 0
          maximum: 100
        max_humidity: {$ref: '#/components/schemas/HaCapabilitySnapshot/properties/min_humidity'}
        available_modes: {$ref: '#/components/schemas/HaOptionList'}
        options: {$ref: '#/components/schemas/HaOptionList'}
        services:
          description: |
            Integration-specific services offered for the entity, already
            typed. Media players, lights, switches, fans and remotes only.
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/HaServiceSnapshot'}
        custom_services:
          description: |
            The integration's services for the entity that Hubbo couldn't
            type (a text, object or other untyped field, or too many fields),
            with HA's field hints. A remote (`remote.*`) also gets HA's
            `remote` services that match it, ahead of the integration's
            (`remote.send_command` first); `remote.turn_on` only when the entity
            has ACTIVITY, for its `activity` field; a remote with no integration
            (YAML) gets only those. They make the device offer `call_service`
            (a Home Assistant action). Response-only services are never here.
            The hints' text (service, label, field names, examples and
            descriptions) is at most 2048 bytes per device and 16384 across
            the config: registering or re-linking keeps the services that
            fit what's left, and a restore over it is `capacity_exceeded` at
            `/devices/N/ha_capabilities/custom_services`.
          type: array
          maxItems: 16
          items: {$ref: '#/components/schemas/HaCustomService'}
    HaCustomService:
      description: |
        A service a Home Assistant action can send (`call_service`), with
        what HA says about its fields. Hints only: the action's `data` is
        written as JSON, never typed against them. Target-like fields
        (`entity_id`, ...) are left out: the target is always the device.
      type: object
      additionalProperties: false
      required: [service, fields]
      properties:
        service: {$ref: '#/components/schemas/HaServiceId'}
        label: {type: string, maxLength: 48}
        fields:
          type: array
          maxItems: 8
          items: {$ref: '#/components/schemas/HaFieldHint'}
    HaFieldHint:
      type: object
      additionalProperties: false
      required: [name, required]
      properties:
        name: {type: string, pattern: '^[a-z][a-z0-9_]{0,31}$'}
        required: {type: boolean}
        example:
          description: |
            HA's example for the field, as HA gives it (any JSON value: a
            quoted `"[1, 2]"` stays a string). Absent when HA has none or it's
            over 64 bytes as JSON.
        description: {type: string, maxLength: 160}
    HaServiceId:
      description: A Home Assistant service, `<domain>.<service>`.
      type: string
      pattern: '^[a-z][a-z0-9_]{0,31}\.[a-z][a-z0-9_]{0,63}$'
    HaServiceCall:
      description: |
        A Home Assistant action's call: `service`, sent to the device's
        entity with `data` verbatim as its service data (HA's call_service,
        no `return_response`). Only with command `call_service` on a Home
        Assistant device. It reaches whatever HA allows for that service,
        lock or alarm services included, so bind it with care.
        Pick the service from the device's `call_service` command's
        `services`. Its domain must be the device's own HA integration
        (`webostv.*` on a webOS TV), or on a remote also `remote`
        (`remote.send_command` with `{"command": "DPAD_UP"}`); any other (`homeassistant.stop`, ...) is
        `forbidden_param` at `.../call/service`. `data` is a JSON object of
        at most 1024 bytes (compact) and 4 levels deep; top-level target keys
        are refused (`forbidden_param`; the target is always the device), and
        so is template text, `{{` or `{%` anywhere (`template_not_supported`:
        HA's call_service sends templates as plain text). Too big is
        `too_long`, too deep `too_deep`. A config holds at most 16 actions
        with a `call` (activities and global bindings together); one more is
        `capacity_exceeded` at its `.../call`. Responses always carry `data`.
      type: object
      additionalProperties: false
      required: [service]
      properties:
        service: {$ref: '#/components/schemas/HaServiceId'}
        data:
          type: object
          additionalProperties: true
          default: {}
          propertyNames:
            not: {enum: [entity_id, device_id, area_id, floor_id, label_id]}
    HaOptionList:
      type: array
      maxItems: 128
      items: {type: string, minLength: 1, maxLength: 64}
    HaServiceSnapshot:
      type: object
      additionalProperties: false
      required: [service, fields]
      properties:
        service:
          description: '`<platform>.<service>`; also the command id.'
          $ref: '#/components/schemas/CommandId'
        label: {type: string, maxLength: 48}
        fields:
          type: array
          maxItems: 4
          items: {$ref: '#/components/schemas/ParamSpec'}
    Device:
      description: |
        The light form, as `GET /devices` lists it. `GET /devices/{id}` adds
        the profile content (`DeviceDetail`).
      allOf: [{$ref: '#/components/schemas/DeviceRuntimeFields'}]
      unevaluatedProperties: false
    DeviceDetail:
      allOf:
        - $ref: '#/components/schemas/DeviceRuntimeFields'
        - $ref: '#/components/schemas/DeviceProfileContent'
      unevaluatedProperties: false
    DeviceRuntimeFields:
      description: Shared by Device and DeviceDetail (open; each closes it).
      allOf: [{$ref: '#/components/schemas/DeviceFields'}]
      required: [revision, availability, platform]
      properties:
        platform:
          description: The device's platform, always `provider.type`.
          type: string
          enum: [home_assistant, ble_hid]
        revision: {$ref: '#/components/schemas/Revision'}
        availability:
          description: |
            `available` / `unavailable`: the integration is connected or not.
            `stale`: the provider no longer knows this target (an HA entity
            missing from the latest discovery). Commands
            fail (`entity_not_found`) until an admin re-links it. Runtime
            state, never saved, and only as current as the last discovery:
            Home Assistant answers a call to a missing entity with success,
            so until a discovery runs (after every boot, too) a renamed or
            removed entity's commands are reported `accepted`. `unknown`:
            the integration can't tell.
          type: string
          enum: [available, unavailable, stale, unknown]
        bluetooth:
          description: Bluetooth devices only (runtime state, never saved).
          $ref: '#/components/schemas/BluetoothStatus'
    DeviceList:
      type: object
      additionalProperties: false
      required: [devices]
      properties:
        devices:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/Device'}
    DeviceRegister:
      description: |
        Either a Home Assistant entity (`provider`) or a built-in profile
        (`profile_id`). A profile device's integration, manufacturer, model
        and commands come from the profile, never the client.
      oneOf:
        - $ref: '#/components/schemas/DeviceRegisterHomeAssistant'
        - $ref: '#/components/schemas/DeviceRegisterProfile'
    DeviceRegisterHomeAssistant:
      type: object
      additionalProperties: false
      required: [name, integration_id, provider]
      properties:
        name: {$ref: '#/components/schemas/Name'}
        integration_id: {$ref: '#/components/schemas/IntegrationId'}
        kind: {$ref: '#/components/schemas/DeviceKind'}
        provider: {$ref: '#/components/schemas/HomeAssistantProvider'}
    DeviceRegisterProfile:
      type: object
      additionalProperties: false
      required: [profile_id]
      properties:
        profile_id: {$ref: '#/components/schemas/ProfileId'}
        name:
          description: Defaults to the profile's `model`.
          $ref: '#/components/schemas/Name'
        kind:
          description: Defaults to the profile's `kind`.
          $ref: '#/components/schemas/DeviceKind'
    DeviceUpdate:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        name: {$ref: '#/components/schemas/Name'}
        kind: {$ref: '#/components/schemas/DeviceKind'}
        provider:
          description: |
            Re-link (e.g. after an HA entity rename). Must stay in the same
            integration. For Home Assistant, sending `provider` (even unchanged)
            re-reads the entity from HA and replaces its stored capabilities.
          $ref: '#/components/schemas/Provider'
        revision: {$ref: '#/components/schemas/Revision'}

    # ---------- profiles ----------
    # Mirrors ~/src/hubbo-devices/schema/profile.schema.json (schema_version
    # 1) for the platforms the hub runs, within the hub's limits
    # (core/include/hubbo/domain/limits.h).
    ProfileId:
      type: string
      pattern: '^(hubbo|harmony|user):[a-z0-9][a-z0-9.-]{0,47}$'
      examples: ['hubbo:apple-tv']
    ProfileDisplayName: {type: string, minLength: 1, maxLength: 64}
    ProfileCommandName:
      type: string
      pattern: '^[A-Za-z0-9]{1,32}$'
      examples: [DirectionUp, PlayPause]
    ProfileHoldMs: {type: integer, minimum: 1, maximum: 10000}
    ProfilePlatform:
      type: string
      enum: [ble_hid]
    ProfileRevision: {type: integer, minimum: 1}
    ProfileSha256:
      description: Of the profile's canonical JSON, meta included.
      type: string
      pattern: '^[0-9a-f]{64}$'
    ProfileRef:
      description: |
        Which profile the device was added from. `revision` and `sha256`
        tell whether a newer one exists.
      type: object
      additionalProperties: false
      required: [id, revision, sha256]
      properties:
        id: {$ref: '#/components/schemas/ProfileId'}
        revision: {$ref: '#/components/schemas/ProfileRevision'}
        sha256: {$ref: '#/components/schemas/ProfileSha256'}
    BleHidCommand:
      description: |
        `keyboard` usages are 0x04-0x65, `consumer` 0x0001-0x03FF (what
        Hubbo's HID report map carries). `hold_ms` makes the press a hold
        that long.
      type: object
      additionalProperties: false
      required: [page, usage]
      properties:
        page: {type: string, enum: [keyboard, consumer]}
        usage: {type: string, pattern: '^0x[0-9A-F]{2,4}$'}
        hold_ms: {$ref: '#/components/schemas/ProfileHoldMs'}
        label: {type: string, minLength: 1, maxLength: 32}
    ProfileCommands:
      type: object
      minProperties: 1
      maxProperties: 128
      propertyNames: {$ref: '#/components/schemas/ProfileCommandName'}
      additionalProperties: {$ref: '#/components/schemas/BleHidCommand'}
    ProfileButtons:
      description: Remote button to command name; `null` leaves the button unfilled.
      type: object
      propertyNames: {$ref: '#/components/schemas/Button'}
      additionalProperties:
        oneOf:
          - $ref: '#/components/schemas/ProfileCommandName'
          - type: 'null'
    ProfileSteps:
      type: array
      minItems: 1
      maxItems: 16
      items:
        oneOf:
          - type: object
            additionalProperties: false
            required: [command]
            properties:
              command: {$ref: '#/components/schemas/ProfileCommandName'}
              hold_ms: {$ref: '#/components/schemas/ProfileHoldMs'}
          - type: object
            additionalProperties: false
            required: [delay_ms]
            properties:
              delay_ms: {type: integer, minimum: 1, maximum: 60000}
    ProfilePower:
      description: |
        `discrete`: `on` and `off`. `toggle`: `toggle`. `none`: no steps.
        `on_delay_ms`: how long the device takes to be ready after power on.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: {type: string, enum: [discrete, toggle, none]}
        'on': {$ref: '#/components/schemas/ProfileSteps'}
        'off': {$ref: '#/components/schemas/ProfileSteps'}
        toggle: {$ref: '#/components/schemas/ProfileSteps'}
        on_delay_ms: {type: integer, minimum: 0, maximum: 60000}
    ProfileTiming:
      type: object
      additionalProperties: false
      properties:
        key_delay_ms: {type: integer, minimum: 0, maximum: 5000}
        input_delay_ms: {type: integer, minimum: 0, maximum: 60000}
    ProfileInputs:
      type: array
      maxItems: 64
      items:
        type: object
        additionalProperties: false
        required: [name, steps]
        properties:
          name: {type: string, minLength: 1, maxLength: 32}
          steps: {$ref: '#/components/schemas/ProfileSteps'}
    ProfileChannels:
      type: object
      additionalProperties: false
      properties:
        digits: {type: integer, minimum: 1, maximum: 4}
        start: {$ref: '#/components/schemas/ProfileCommandName'}
        finish: {$ref: '#/components/schemas/ProfileCommandName'}
    ProfileHeader:
      description: A profile's identity (open; each user closes it).
      type: object
      required: [id, revision, manufacturer, model, kind, platform]
      properties:
        id: {$ref: '#/components/schemas/ProfileId'}
        revision: {$ref: '#/components/schemas/ProfileRevision'}
        manufacturer: {$ref: '#/components/schemas/ProfileDisplayName'}
        model: {$ref: '#/components/schemas/ProfileDisplayName'}
        kind: {$ref: '#/components/schemas/DeviceKind'}
        platform: {$ref: '#/components/schemas/ProfilePlatform'}
    ProfileSummary:
      allOf: [{$ref: '#/components/schemas/ProfileHeader'}]
      required: [sha256]
      properties:
        sha256: {$ref: '#/components/schemas/ProfileSha256'}
      unevaluatedProperties: false
    ProfileList:
      type: object
      additionalProperties: false
      required: [profiles]
      properties:
        profiles:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/ProfileSummary'}
    Profile:
      description: |
        A built-in profile as the hub keeps it: the device profile spec's
        document without `meta`.
      allOf:
        - $ref: '#/components/schemas/ProfileHeader'
        - $ref: '#/components/schemas/ProfileFields'
      required: [schema_version, source, commands]
      properties:
        schema_version: {type: integer, const: 1}
        source: {type: string, enum: [hubbo, harmony, user]}
      unevaluatedProperties: false
    Kind:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id: {$ref: '#/components/schemas/DeviceKind'}
        label: {type: string, minLength: 1, maxLength: 32}
    KindList:
      type: object
      additionalProperties: false
      required: [kinds]
      properties:
        kinds:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/Kind'}

    # ---------- integrations ----------
    IntegrationSummary:
      type: object
      additionalProperties: false
      required: [id, type, name, enabled, state, device_count]
      properties:
        id: {$ref: '#/components/schemas/IntegrationId'}
        type: {$ref: '#/components/schemas/IntegrationType'}
        name: {$ref: '#/components/schemas/Name'}
        enabled: {type: boolean}
        state: {$ref: '#/components/schemas/IntegrationState'}
        detail:
          description: Short human status, never secrets or URLs with credentials.
          type: string
          maxLength: 120
        device_count: {type: integer, minimum: 0}
        commands:
          description: Deviceless commands of this integration (only `system` has any). Use with `device_id = null`.
          type: array
          items: {$ref: '#/components/schemas/Command'}
    IntegrationList:
      type: object
      additionalProperties: false
      required: [integrations]
      properties:
        integrations:
          type: array
          items: {$ref: '#/components/schemas/IntegrationSummary'}
    HomeAssistantSettings:
      type: object
      additionalProperties: false
      required: [type, url, verify_tls, has_access_token]
      properties:
        type: {const: home_assistant}
        url:
          description: |
            Base URL, e.g. `https://homeassistant.local:8123`. No credentials,
            path or query. `""`: not set up yet (the built-in `ha_main` starts
            so, and reports `not_configured`).
          type: string
          pattern: '^(https?://[^/@?#\s]+(:[0-9]{1,5})?/?)?$'
          maxLength: 200
        verify_tls:
          description: |
            `https://` only. True (the default): Home Assistant's certificate
            is verified against the public CA bundle the hub ships. False:
            the connection is still encrypted, but the server isn't
            verified, so anyone on the network path could pose as HA and
            receive the token. Use it only for a self-signed HA on a
            trusted LAN. (There's no custom CA setting.)
          type: boolean
        has_access_token: {type: boolean, readOnly: true}
    BleHidSettings:
      type: object
      additionalProperties: false
      required: [type, device_name]
      properties:
        type: {const: ble_hid}
        device_name:
          description: The name hosts see when pairing. Bonds live on each device (`bluetooth`).
          type: string
          minLength: 1
          maxLength: 29
    MqttSettings:
      type: object
      additionalProperties: false
      required: [type, host, port, username, has_password]
      properties:
        type: {const: mqtt}
        host:
          description: |
            The broker: an IPv4 address, a hostname or an IPv6 address
            (plain MQTT on the LAN, no TLS). No port: that's `port`
            (`192.168.1.5:1883` is refused). Use an IP if `.local` names
            don't resolve on your network. `""`: not set up yet (the built-in
            `mqtt_main` starts so, and reports `not_configured`).
          type: string
          pattern: '^([A-Za-z0-9._-]*|[A-Za-z0-9._-]*:[A-Za-z0-9._:-]*:[A-Za-z0-9._:-]*)$'
          maxLength: 253
        port: {type: integer, minimum: 1, maximum: 65535, default: 1883}
        username:
          description: '`""`: none (an anonymous broker).'
          type: string
          maxLength: 64
          pattern: '^[^\x00-\x1f\x7f]*$'
        has_password: {type: boolean, readOnly: true}
    SystemSettings:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: {const: system}
    IntegrationConfig:
      type: object
      additionalProperties: false
      required: [id, type, name, enabled, settings, revision]
      properties:
        id: {$ref: '#/components/schemas/IntegrationId'}
        type: {$ref: '#/components/schemas/IntegrationType'}
        name: {$ref: '#/components/schemas/Name'}
        enabled: {type: boolean}
        settings:
          oneOf:
            - $ref: '#/components/schemas/HomeAssistantSettings'
            - $ref: '#/components/schemas/BleHidSettings'
            - $ref: '#/components/schemas/MqttSettings'
            - $ref: '#/components/schemas/SystemSettings'
          discriminator:
            propertyName: type
            mapping:
              home_assistant: '#/components/schemas/HomeAssistantSettings'
              ble_hid: '#/components/schemas/BleHidSettings'
              mqtt: '#/components/schemas/MqttSettings'
              system: '#/components/schemas/SystemSettings'
        revision: {$ref: '#/components/schemas/Revision'}
    IntegrationConfigUpdate:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        name: {$ref: '#/components/schemas/Name'}
        enabled: {type: boolean}
        settings:
          oneOf:
            - $ref: '#/components/schemas/HomeAssistantSettingsUpdate'
            - $ref: '#/components/schemas/BleHidSettingsUpdate'
            - $ref: '#/components/schemas/MqttSettingsUpdate'
          discriminator:
            propertyName: type
            mapping:
              home_assistant: '#/components/schemas/HomeAssistantSettingsUpdate'
              ble_hid: '#/components/schemas/BleHidSettingsUpdate'
              mqtt: '#/components/schemas/MqttSettingsUpdate'
        revision: {$ref: '#/components/schemas/Revision'}
    HomeAssistantSettingsUpdate:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: {const: home_assistant}
        url: {$ref: '#/components/schemas/HomeAssistantSettings/properties/url'}
        verify_tls: {$ref: '#/components/schemas/HomeAssistantSettings/properties/verify_tls'}
        access_token:
          description: Long-lived HA access token. Write-only; omit to keep, null to clear.
          type: [string, 'null']
          writeOnly: true
          minLength: 1
          maxLength: 512
    BleHidSettingsUpdate:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: {const: ble_hid}
        device_name: {$ref: '#/components/schemas/BleHidSettings/properties/device_name'}
    MqttSettingsUpdate:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: {const: mqtt}
        host: {$ref: '#/components/schemas/MqttSettings/properties/host'}
        port: {$ref: '#/components/schemas/MqttSettings/properties/port'}
        username: {$ref: '#/components/schemas/MqttSettings/properties/username'}
        password:
          description: The broker password. Write-only; omit to keep, null to clear.
          type: [string, 'null']
          writeOnly: true
          minLength: 1
          maxLength: 512
    DiscoverCandidate:
      type: object
      additionalProperties: false
      required: [provider, name, domain, supported, registered_device_id, suggested_kind]
      properties:
        provider: {$ref: '#/components/schemas/HomeAssistantProvider'}
        suggested_kind:
          description: |
            The kind a new device of this entity starts with: by domain
            (light, switch, fan, cover, scene and script are their own kinds,
            `humidifier` is `climate`, `button`, `input_boolean`, `select` and
            `remote` are `other`), and for a media player by its device class or
            integration (`apple_tv` is `streamer`).
          $ref: '#/components/schemas/DeviceKind'
        name: {type: string, maxLength: 100}
        domain: {type: string, maxLength: 32}
        platform:
          description: The HA integration that provides the entity (e.g. `sonos`), from the entity registry. Absent for YAML-only entities.
          type: string
          maxLength: 32
        state: {type: string, maxLength: 32}
        supported:
          description: False when Hubbo offers no commands for it (unsupported domain or features).
          type: boolean
        command_ids:
          description: |
            A preview: the domain's commands only. The integration's own
            services come with the entity's details (`EntityDetailsStatus`).
          type: array
          items: {$ref: '#/components/schemas/CommandId'}
        dropped_options:
          description: Enum options left out (too long, or too many); the commands still work with the rest.
          type: integer
          minimum: 0
        registered_device_id:
          $ref: '#/components/schemas/NullableDeviceId'
    EntityDetailsStatus:
      description: |
        One entity's details, loaded from Home Assistant for registering it:
        `running`, then `done` (everything a discovery candidate has, plus
        the integration's services in `command_ids`, `skipped_services` and
        `provider.unique_id`) or `failed` (`error`). `idle`: nothing loaded
        for this entity.
      type: object
      additionalProperties: false
      required: [state]
      allOf:
        - if: {properties: {state: {const: done}}}
          then: {required: [entity_id, provider, name, domain, supported, command_ids, dropped_options, skipped_services, registered_device_id]}
        - if: {properties: {state: {const: failed}}}
          then: {required: [entity_id, error]}
        - if: {properties: {state: {const: running}}}
          then: {required: [entity_id]}
      properties:
        state: {type: string, enum: [idle, running, done, failed]}
        entity_id: {type: string, pattern: '^[a-z0-9_]+\.[a-z0-9_]+$', maxLength: 96}
        error:
          description: Why it failed. Never secrets or URLs with credentials.
          type: string
          maxLength: 120
        provider: {$ref: '#/components/schemas/HomeAssistantProvider'}
        name: {type: string, maxLength: 100}
        domain: {type: string, maxLength: 32}
        platform:
          description: Absent for YAML-only entities (no integration services).
          type: string
          maxLength: 32
        supported:
          description: False when Hubbo offers no commands for it; registering it is then `422 unknown_device`.
          type: boolean
        command_ids:
          type: array
          items: {$ref: '#/components/schemas/CommandId'}
        dropped_options:
          description: Enum options left out (too long, or too many); the commands still work with the rest.
          type: integer
          minimum: 0
        skipped_services:
          description: |
            Integration services that match the entity but aren't offered,
            and why: `unsupported_field` (a field Hubbo can't type, or a
            filter or name it can't read), `too_many_fields` (more than 4),
            `response_only` (it only returns data), `too_many_services`
            (past 32).
          type: array
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [service, reason]
            properties:
              service: {type: string, maxLength: 65}
              reason: {type: string, enum: [unsupported_field, too_many_fields, response_only, too_many_services]}
        registered_device_id:
          $ref: '#/components/schemas/NullableDeviceId'
    DiscoverStatus:
      description: |
        `done` carries the page and its totals, `failed` the reason; `idle`
        and `running` carry only the state.
      type: object
      additionalProperties: false
      required: [state]
      allOf:
        - if: {properties: {state: {const: done}}}
          then: {required: [total, truncated, elapsed_ms, candidates, next_cursor]}
        - if: {properties: {state: {const: failed}}}
          then: {required: [error]}
      properties:
        state: {type: string, enum: [idle, running, done, failed]}
        error:
          description: Why it failed (`failed` only). Never secrets or URLs with credentials.
          type: string
          maxLength: 120
        total:
          description: Candidates found (`done`), before `q`/`domain` filtering.
          type: integer
          minimum: 0
        truncated:
          description: |
            `done` only: entities of the supported domains left out because
            discovery stops at 2048 candidates. `0`: the list is complete;
            above 0, narrow it in Home Assistant (e.g. disable unused
            entities) to see the rest.
          type: integer
          minimum: 0
        elapsed_ms:
          description: '`done` only: how long the discovery took on the hub, from the request to the result.'
          type: integer
          minimum: 0
        candidates:
          description: '`done` only: the page matching `q` and `domain`.'
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/DiscoverCandidate'}
        next_cursor: {type: [string, 'null'], maxLength: 64}
    BluetoothStatus:
      description: |
        One Bluetooth device's host. `not_paired`: no bond. `pairing`: its
        window is open, `window_s` left. `connected` / `not_connected`: a
        bonded host, connected now or not (its keys are `unavailable` until it
        reconnects).
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: {type: string, enum: [not_paired, pairing, connected, not_connected]}
        window_s: {type: integer, minimum: 0}
    RemotePairStatus:
      description: |
        The latest scan: `idle` (none since boot), `scanning`, `found` (the
        new endpoint is saved and in use), `timeout` (no Hub answered in
        120 s) or `stopped` (cancelled). `paired`: an endpoint is known.
      type: object
      additionalProperties: false
      required: [state, paired]
      properties:
        state: {type: string, enum: [idle, scanning, found, timeout, stopped]}
        paired: {type: boolean}
        remaining_s: {type: integer, minimum: 0}
        channel:
          description: '`scanning`: the channel being tried; otherwise the endpoint''s.'
          type: integer
          minimum: 0
          maximum: 124
        message: {type: string, maxLength: 120}
    RemoteEndpoint:
      type: object
      additionalProperties: false
      required: [channel, address]
      properties:
        channel: {type: integer, minimum: 0, maximum: 124}
        address:
          description: 40-bit nRF24 address, 10 upper-case hex digits.
          type: string
          pattern: '^[0-9A-F]{10}$'
    RemoteEndpointUpdate:
      type: object
      additionalProperties: false
      required: [channel, address]
      properties:
        channel: {type: integer, minimum: 0, maximum: 124}
        address:
          description: Hex, `0x` optional, up to 10 digits (40 bits).
          type: string
          pattern: '^(0[xX])?[0-9A-Fa-f]{1,10}$'
    RemoteConfig:
      type: object
      additionalProperties: false
      required: [radio, endpoint, pairing]
      properties:
        radio:
          description: '`not_ready` (radio not working), `idle` (no endpoint), `scanning` or `listening`.'
          type: string
          enum: [not_ready, idle, scanning, listening]
        endpoint:
          oneOf:
            - $ref: '#/components/schemas/RemoteEndpoint'
            - {type: 'null'}
        pairing: {$ref: '#/components/schemas/RemotePairStatus'}

    # ---------- backup / firmware ----------
    BackupIntegration:
      type: object
      additionalProperties: false
      required: [id, type, name, enabled]
      properties:
        id: {$ref: '#/components/schemas/IntegrationId'}
        type: {$ref: '#/components/schemas/IntegrationType'}
        name: {$ref: '#/components/schemas/Name'}
        enabled: {type: boolean}
        settings:
          description: Non-secret settings only.
          type: object
          additionalProperties: false
          properties:
            url: {$ref: '#/components/schemas/HomeAssistantSettings/properties/url'}
            verify_tls: {type: boolean}
            device_name: {$ref: '#/components/schemas/BleHidSettings/properties/device_name'}
            host: {$ref: '#/components/schemas/MqttSettings/properties/host'}
            port: {$ref: '#/components/schemas/MqttSettings/properties/port'}
            username: {$ref: '#/components/schemas/MqttSettings/properties/username'}
    Backup:
      type: object
      additionalProperties: false
      required: [format, format_version, created_at, firmware_version, board, integrations, devices, global_bindings, activities, excluded]
      properties:
        format: {const: hubbo-backup}
        format_version: {type: integer, const: 1}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        firmware_version: {type: string, maxLength: 32}
        board: {type: string, maxLength: 32}
        remote:
          description: Pairing (radio address and channel). Not a credential.
          type: object
          additionalProperties: false
          required: [address, channel]
          properties:
            address: {type: string, pattern: '^[0-9A-F]{10}$'}
            channel: {type: integer, minimum: 0, maximum: 125}
        integrations:
          type: array
          maxItems: 8
          items: {$ref: '#/components/schemas/BackupIntegration'}
        devices:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/StoredDevice'}
        global_bindings: {$ref: '#/components/schemas/BackupGlobalBindings'}
        smart_buttons:
          description: Always written. A restore without it gets four empty slots.
          allOf: [{$ref: '#/components/schemas/BackupSmartButtons'}]
        activities:
          type: array
          maxItems: 16
          items: {$ref: '#/components/schemas/BackupActivity'}
        excluded:
          description: What a restore will not bring back.
          type: array
          items:
            type: string
            enum: [admin_password, api_tokens, integration_secrets, ble_bonds]
    RestoreRequest:
      description: |
        A `Backup`, or a saved config record as `GET /admin/backup` exports it
        while the config is blocked (`X-Hubbo-Backup: blocked-raw`).
      oneOf:
        - {$ref: '#/components/schemas/Backup'}
        - {$ref: '#/components/schemas/BlockedConfigRecord'}
    BlockedConfigRecord:
      description: |
        The saved config record exactly as stored (`format: hubbo-config`).
        Its layout belongs to the firmware that wrote it, so only the header is
        described here; the hub checks the rest on restore.
      type: object
      required: [format, schema_version]
      properties:
        format: {const: hubbo-config}
        schema_version: {type: integer, minimum: 0}
        revision: {type: integer, minimum: 0}
    RestoreResult:
      type: object
      additionalProperties: false
      required: [dry_run, devices, activities, integrations, requires]
      properties:
        dry_run: {type: boolean}
        devices: {type: integer, minimum: 0}
        activities: {type: integer, minimum: 0}
        integrations: {type: integer, minimum: 0}
        migrated_from:
          type: [integer, 'null']
        requires:
          description: Follow-up the admin must do.
          type: array
          items:
            type: string
            enum: [home_assistant_token, mqtt_password, ble_pairing, api_tokens]
        warnings:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/ErrorDetail'}
    ApiIndex:
      type: object
      additionalProperties: false
      required: [name, version, about, docs, openapi, auth]
      properties:
        name: {type: string, const: Hubbo API}
        about:
          description: What to read first.
          type: string
        version:
          description: The firmware version (as `/status` `hubbo.version`).
          type: string
          maxLength: 32
        docs: {type: string, const: /api/v1/agent.md}
        openapi: {type: string, const: /api/v1/openapi.json}
        auth:
          description: How to authenticate, in a sentence.
          type: string
    OpenApiDocument:
      description: An OpenAPI 3.1 document (this one).
      type: object
      required: [openapi, info, paths]
      properties:
        openapi: {type: string, const: 3.1.0}
        info: {type: object}
        paths: {type: object}
    Empty:
      type: object
      additionalProperties: false
      maxProperties: 0
    HubName:
      description: |
        What the hub is called: 1 to 32 characters, no control characters,
        no space at either end. A new hub is called "Hubbo XXXX", XXXX
        being the end of its network MAC in hex (e.g. "Hubbo 3F2A"), until
        it's renamed. A factory reset brings it back.
      type: string
      minLength: 1
      maxLength: 32
      pattern: '^[^ \x00-\x1f\x7f-\x9f]([^\x00-\x1f\x7f-\x9f]*[^ \x00-\x1f\x7f-\x9f])?$'
      examples: [Hubbo 3F2A, Living Room]
    Hub:
      type: object
      additionalProperties: false
      required: [name, hostname, hostname_conflict]
      properties:
        name: {$ref: '#/components/schemas/HubName'}
        hostname:
          description: |
            Read-only: the `.local` hostname the hub advertises. It comes
            from the name: lowercased, each run of characters other than
            `a-z` and `0-9` becomes one `-`, with none at either end;
            `hubbo` when nothing is left ("Living Room" is `living-room`).
            If another device on the network already has that hostname,
            this is the one the hub took instead, e.g. `living-room-2`.
          type: string
          readOnly: true
          minLength: 1
          maxLength: 63
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          examples: [hubbo-3f2a, living-room, living-room-2]
        hostname_conflict:
          description: |
            Read-only: true when another device on the network has the
            name's hostname, so `hostname` is a different one. A rename
            clears it until the network is checked again.
          type: boolean
          readOnly: true
    HubUpdate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, examples: [Living Room]}
    FirmwareStatus:
      type: object
      additionalProperties: false
      required: [version, board, update]
      properties:
        version:
          description: The running firmware's version (`git describe`).
          type: string
          maxLength: 32
        board: {type: string, maxLength: 32}
        update:
          type: object
          additionalProperties: false
          required: [state, progress, error]
          properties:
            state:
              description: |
                `idle`: nothing running. `writing`: erasing and writing the
                inactive slot. `rebooting`: written and set to boot; the hub
                restarts shortly. `failed`: the latest update stopped (`error`);
                the running firmware stays and still boots.
              type: string
              enum: [idle, writing, rebooting, failed]
            progress:
              description: Percent of the image written (`writing`; 100 once `rebooting`).
              type: integer
              minimum: 0
              maximum: 100
            error:
              description: '`failed` only: a short code such as `write_failed` or `verify_failed`.'
              type: [string, 'null']
              maxLength: 64
