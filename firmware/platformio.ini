; Hubbo firmware. One board for the MVP: Waveshare ESP32-S3-ETH
; (16 MB flash, 8 MB OPI PSRAM, W5500 Ethernet). Run via `bin/hubbo fw ...`.

[platformio]
default_envs = waveshare_esp32_s3_eth

[env:waveshare_esp32_s3_eth]
; espressif32 8.0.0 = arduino-esp32 3.3.12 (ESP-IDF 5.5), the same core
; Harmonizer shipped on (verified from its firmware image). GCC 14.2.
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
; Two app slots for OTA. A Hubbo-specific table (web assets, config) comes later.
board_build.partitions = default_16MB.csv
monitor_speed = 115200
; -O2: this platform's Arduino flags carry no optimization level, so
; without it every source (ours, core, ArduinoJson, NimBLE-Arduino, RF24)
; built at -O0. A 93 KB restore dry run took ~25 s instead of ~1 s.
build_flags =
    -O2
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D HUBBO_BOARD_WAVESHARE_ESP32_S3_ETH=1
; ota_password_hash: compiles in SHA-256(HUBBO_OTA_PASSWORD) from the build
; environment (never the password); unset means OTA is off.
; drop_unused_idf_libs: drops esp_matter from the link (see the script).
; web_assets: embeds web/dist (run `bin/hubbo web build` first).
extra_scripts =
    pre:scripts/ota_password_hash.py
    pre:scripts/web_assets.py
    post:scripts/drop_unused_idf_libs.py
lib_deps =
    symlink://../core
    ; Versions the Harmonizer spike ran on.
    nRF24/RF24@1.6.2
    h2zero/NimBLE-Arduino@2.5.1

; Network upload to a board already running Hubbo with OTA compiled in:
;   bin/hubbo ota <ip>   (supplies HUBBO_OTA_PASSWORD from a private file)
[env:waveshare_esp32_s3_eth_ota]
extends = env:waveshare_esp32_s3_eth
; Dev builds for the dev board: also the read-only dev console over HTTP
; (/debug/log, /debug/run, /debug/bench; see src/main.cpp), since the board
; runs on PoE with no serial attached.
build_flags =
    ${env:waveshare_esp32_s3_eth.build_flags}
    -D HUBBO_DEV_CONSOLE=1
upload_protocol = espota
upload_flags =
    --auth=${sysenv.HUBBO_OTA_PASSWORD}
