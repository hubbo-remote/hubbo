; Hubbo firmware. One board for the MVP: Waveshare ESP32-S3-ETH
; (16 MB flash, 8 MB OPI PSRAM, W5500 Ethernet). Run via `bin/hubbo fw ...`.

[platformio]
default_envs = waveshare_esp32_s3_eth

[env:waveshare_esp32_s3_eth]
; espressif32 8.0.0 = arduino-esp32 3.3.12 (ESP-IDF 5.5), the same core
; Harmonizer shipped on (verified from its firmware image). GCC 14.2.
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
; Two app slots for OTA. A Hubbo-specific table (web assets, config) comes later.
board_build.partitions = default_16MB.csv
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D HUBBO_BOARD_WAVESHARE_ESP32_S3_ETH=1
    ; ArduinoOTA is compiled in only when HUBBO_OTA_PASSWORD is set in the
    ; environment at build time. Empty (the default) means OTA is off.
    '-D HUBBO_OTA_PASSWORD="${sysenv.HUBBO_OTA_PASSWORD}"'
lib_deps =
    symlink://../core
    ; Versions the Harmonizer spike ran on.
    nRF24/RF24@1.6.2
    h2zero/NimBLE-Arduino@2.5.1

; Network upload to a board already running Hubbo with OTA compiled in.
; Build and upload with HUBBO_OTA_PASSWORD set, and give the board's address:
;   bin/hubbo fw run -e waveshare_esp32_s3_eth_ota -t upload --upload-port <ip>
[env:waveshare_esp32_s3_eth_ota]
extends = env:waveshare_esp32_s3_eth
upload_protocol = espota
upload_flags =
    --auth=${sysenv.HUBBO_OTA_PASSWORD}
